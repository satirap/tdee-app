<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TDEE ต้น & พัช</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="apple-mobile-web-app-title" content="TDEE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface-2:#f0eee9; --text:#1d1c1a; --muted:#6b6862;
  --border:#e2dfd8; --ton:#2f6fdb; --patt:#e0613f; --good:#1f8a5b; --warn:#b7791f; --danger:#c43d3d;
  --ton-soft:rgba(47,111,219,.12); --patt-soft:rgba(224,97,63,.12);
  --prot:#1f8a5b; --carb:#c9941a; --fat:#8a63d2; --on-macro:#fff;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141413; --surface:#1e1d1b; --surface-2:#282724; --text:#eceae4; --muted:#9d9a92;
    --border:#34322e; --ton:#6b9bf0; --patt:#f08766; --good:#4cc38a; --warn:#e0a84a; --danger:#ef6b6b;
    --ton-soft:rgba(107,155,240,.16); --patt-soft:rgba(240,135,102,.16);
    --prot:#4cc38a; --carb:#e6b949; --fat:#a98bf0; --on-macro:#141413;
  }
}
:root[data-theme="dark"]{
  --bg:#141413; --surface:#1e1d1b; --surface-2:#282724; --text:#eceae4; --muted:#9d9a92;
  --border:#34322e; --ton:#6b9bf0; --patt:#f08766; --good:#4cc38a; --warn:#e0a84a; --danger:#ef6b6b;
  --ton-soft:rgba(107,155,240,.16); --patt-soft:rgba(240,135,102,.16);
  --prot:#4cc38a; --carb:#e6b949; --fat:#a98bf0; --on-macro:#141413;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Thai",system-ui,sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:22px;margin:0;font-weight:700}
.refresh{display:grid;place-items:center;flex:none;width:38px;height:38px;border:0;border-radius:12px;background:var(--surface-2);color:var(--muted);cursor:pointer}
header h1{margin-right:auto}
.refresh:hover{color:var(--text)}
.refresh.spin svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--muted)}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 8px}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px}
.tabs button{border:0;background:transparent;color:var(--muted);padding:7px 16px;border-radius:9px;font:inherit;font-weight:500;cursor:pointer}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.person-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.pill{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:17px}
.dot{width:12px;height:12px;border-radius:50%}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:8px 0 14px}
.stat{background:var(--surface-2);border-radius:10px;padding:10px 12px;min-width:0}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .v small{font-size:12px;font-weight:500;color:var(--muted)}
.stats.strip{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:12px 0 0}
.stats.strip .stat{padding:8px 10px}
.stats.strip .l{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats.strip .v{font-size:16px}
.person-card{border-top:4px solid var(--c)}
.rings{display:block;width:100%;max-width:230px;margin:4px auto 0}
.rings text{font-family:inherit;dominant-baseline:middle}
.rings .rt{font-size:10.5px;font-weight:700;dominant-baseline:central;letter-spacing:.02em;fill:var(--text);stroke:var(--surface);stroke-width:3px;stroke-linejoin:round;paint-order:stroke}
.rings .rl{font-size:13px;fill:var(--muted)}
.rings .rv{font-size:40px;font-weight:700;fill:var(--text);letter-spacing:-.02em}
.rings .rv.bad{fill:var(--danger)}
.ring-rows{margin:14px 0 0;display:grid;gap:8px}
.ring-rows>div{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.ring-rows>div>span:last-child{min-width:92px;text-align:right}
.rk{display:inline-flex;align-items:center;gap:6px}
.rk i{width:8px;height:8px;border-radius:50%}
.ring-week{font-size:13px;text-align:center;margin-top:10px}
.ring-minor{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
.prog{margin-top:14px;border-top:1px solid var(--border);padding-top:12px}
details.prog summary{list-style:none;cursor:pointer}
details.prog summary::-webkit-details-marker{display:none}
details.prog .chev{display:inline-block;transition:transform .15s}
details.prog[open] .chev{transform:rotate(180deg)}
details.prog .stats{margin-bottom:0;grid-template-columns:repeat(3,1fr)}
details.prog .stat .v{font-size:17px}
.chart-box.tall{height:380px}
.chart-box.short{height:220px}
.subtabs{display:flex;gap:24px;border-bottom:1px solid var(--border);margin:0 0 16px;overflow-x:auto;scrollbar-width:none}
.subtabs button{border:0;background:none;font:inherit;color:var(--muted);padding:4px 0 10px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.subtabs button.on{color:var(--text);font-weight:600;border-bottom-color:var(--c)}
.weighform{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:8px;align-items:end}
@media (max-width:560px){.weighform{grid-template-columns:1fr 1fr auto}.weighform .wd{grid-column:1/-1}}
.mname{font-size:12px;margin-bottom:4px}
.mname input{font-size:15px}
.mlabel{font-size:12px;color:var(--muted);margin:14px 0 6px}
.mlabel+.search{margin-top:0}
.meal-total{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:14px;font-variant-numeric:tabular-nums}
.meal-total b{font-size:20px}
.plan-note{font-size:13px;margin-bottom:6px;min-height:1px}
.intake-sum{display:flex;gap:32px;margin:2px 0 12px}
.intake-sum .l{display:block;font-size:12px;color:var(--muted)}
.intake-sum b{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.intake-sum small{color:var(--muted);font-size:12px;margin-left:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
input,select{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:7px 10px;min-width:0;width:100%}
input:focus,select:focus{outline:2px solid var(--c,var(--ton));outline-offset:-1px}
button.btn{font:inherit;font-weight:600;border:0;border-radius:9px;padding:8px 16px;cursor:pointer;background:var(--c,var(--ton));color:#fff}
button.ghost{font:inherit;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:9px;padding:6px 12px;cursor:pointer}
button.x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 6px}
button.x:hover{color:var(--danger)}
.bar{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px}
.goal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chips button{font:inherit;font-size:13px;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:99px;padding:3px 11px;cursor:pointer}
.chips button.on{background:var(--c);border-color:var(--c);color:#fff}
.eaten{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.eaten span{font-size:13px;background:var(--surface-2);border-radius:99px;padding:3px 4px 3px 12px;display:inline-flex;align-items:center;gap:6px}
.eaten select{font-size:12px;padding:2px 4px;width:auto;border-radius:6px}
.eaten .amt{width:58px;padding:2px 6px;font-size:12px;border-radius:6px;text-align:right}
.eaten em{font-style:normal;font-size:12px;color:var(--muted)}

.foodform{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}
.foodform .wide{grid-column:1/-1}
.foodform button{white-space:nowrap}
.foodform input,.foodform select{height:38px}
.foodform .btn:last-child{grid-column:span 2}
.search{margin-top:16px}
.card h2+.search,.daynav+.search{margin-top:0}
.daynav{display:flex;align-items:center;gap:4px;margin:-6px 0 10px}
.daynav .x{font-size:24px;line-height:1;padding:2px 10px;color:var(--text)}
.daynav .x:disabled{opacity:.25;cursor:default}
.daynav .x:hover{color:var(--c)}
.dlabel{position:relative;flex-direction:row;font-size:15px;font-weight:600;color:var(--text);padding:2px 6px;cursor:pointer}
.dlabel input{position:absolute;inset:0;opacity:0;cursor:pointer;padding:0}
.daynav .sm{margin-left:auto;font-size:12px;padding:3px 10px}
.searchrow{display:flex;gap:8px}
.searchrow > input{padding:11px 14px;border-radius:12px;background:var(--surface-2);border-color:transparent}
.results{margin-top:4px}
.scanbtn{display:none;flex:none;width:46px;border:0;border-radius:12px;background:var(--surface-2);color:var(--text);place-items:center;cursor:pointer}
@media (max-width:760px),(pointer:coarse){.scanbtn{display:grid}}
.scanner{position:fixed;inset:0;z-index:50;background:#000}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanner .frame{position:absolute;left:8%;right:8%;top:36%;height:20%;border:2px solid rgba(255,255,255,.9);border-radius:16px;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}
.scanner .sbar{position:absolute;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));color:#fff;font-size:14px;background:linear-gradient(transparent,rgba(0,0,0,.75) 30%)}
.scanner .st{margin-bottom:12px;text-align:center}
.scanner .sbtns{display:flex;gap:8px}
.scanner .sb{flex:1;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:99px;padding:11px 8px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.res{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--border)}
.res:last-child{border-bottom:0}
.res button.x{display:grid;place-items:center;width:30px;height:30px;padding:0}
.res-main{flex:1;min-width:0;display:flex;flex-direction:column;border:0;background:transparent;color:var(--text);font:inherit;text-align:left;padding:10px 6px;border-radius:8px}
button.res-main{cursor:pointer}
button.res-main:hover{background:var(--surface-2)}
.res .n{font-size:14px;font-weight:500}
.res .s{color:var(--muted);font-weight:400;margin-left:6px;font-size:13px}
.res .m{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{font-size:13px;color:var(--muted);padding:12px 6px 8px}
.addnew{padding:0 6px}
table.log td.num,table.log th.num{text-align:right}
.breakdown{font-size:13px;color:var(--muted);line-height:1.8}
.breakdown b{color:var(--text);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .good{color:var(--good)} .bad{color:var(--danger)} .warn{color:var(--warn)}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.alert{background:var(--surface-2);border-left:3px solid var(--warn);padding:8px 12px;border-radius:6px;font-size:13px;margin-top:10px}
.chart-box{position:relative;height:340px;overflow:hidden;width:100%;min-width:0}
.chart-box canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;padding:4px 12px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text)}
table.log{width:100%;border-collapse:collapse;font-size:14px}
table.log th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--border)}
table.log td{padding:7px 8px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.act{display:grid;grid-template-columns:1.4fr 1fr 1.6fr .8fr auto;gap:6px;align-items:end;padding:8px 0;border-bottom:1px dashed var(--border)}
.act .dual{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pf{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
footer{margin-top:24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.hidden{display:none!important}
[hidden]{display:none!important}
.tag{font-size:10px;font-weight:600;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}
.center{max-width:420px;margin:60px auto;text-align:center}
.center p{color:var(--muted)}
@media (max-width:560px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .stats.strip{grid-template-columns:repeat(4,minmax(0,1fr))}
  .stats.strip .stat{padding:7px 8px}
  .stats.strip .v{font-size:14px}
  .act{grid-template-columns:1fr 1fr}
  .act .dual{grid-column:1/-1}
  .chart-box,.chart-box.tall{height:280px}
  .chart-box.short{height:200px}
  .tabs button{padding:7px 12px}
  header h1{flex:1}
  header .refresh{order:2}
  header .tabs{order:3}
}
</style>

<body>
<div class="wrap">
  <header>
    <h1>TDEE Tracker<small>ลดไขมัน · ต้น & พัช</small></h1>
    <nav class="tabs hidden" id="tabs">
      <button data-tab="overview">ภาพรวม</button>
      <button data-tab="ton">ต้น</button>
      <button data-tab="patt">พัช</button>
      <button data-tab="foods">My Food</button>
    </nav>
    <button id="refreshBtn" class="refresh" aria-label="รีเฟรช" title="โหลดเวอร์ชันล่าสุด"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button>
  </header>
  <main id="app"></main>
  <footer id="footer" class="hidden">
    <button class="ghost" id="logoutBtn">🔒 ล็อก</button>
    <button class="ghost" id="exportBtn">⬇︎ Export ข้อมูล (JSON)</button>
    <label class="ghost" style="flex-direction:row;cursor:pointer;border:1px solid var(--border);border-radius:9px;padding:6px 12px;color:var(--text);font-size:15px">⬆︎ Import<input type="file" id="importFile" accept=".json" hidden></label>
    <span>ข้อมูลซิงก์ผ่าน Firebase · Export ไว้สำรองเป็นระยะ</span>
  </footer>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, doc, onSnapshot, setDoc, updateDoc, increment, deleteField } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { firebaseConfig } from './firebase-config.js';
import { STD_FOODS } from './foods-th.js';

const PREF_KEY = 'tdee-prefs-v1';
const PIN_KEY = 'tdee-pin';
const IDS = ['ton', 'patt'];
const KCAL_PER_KG = 7700;
const JOBS = {
  office: { f: 1.2,  label: 'นั่งโต๊ะเป็นหลัก (office)' },
  light:  { f: 1.3,  label: 'ยืน/เดินระหว่างวัน (ไม่ใช่ office)' },
  active: { f: 1.45, label: 'ใช้แรง/เดินเกือบทั้งวัน' }
};
const uid = () => Math.random().toString(36).slice(2, 9);
const todayStr = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const dayMs = d => Date.parse(d + 'T00:00:00Z');
const fmt = (n, d = 0) => n == null || isNaN(n) ? '–' : Number(n).toLocaleString('th-TH', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtDate = s => new Date(dayMs(s)).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit', timeZone: 'UTC' });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function defaults() {
  return {
    tab: 'overview', intakeRange: 7,
    people: {
      ton: {
        name: 'ต้น', sex: '', age: '', height: '', goalWeight: '', deficit: 500, job: 'light',
        activities: [
          { id: uid(), name: 'ตีแบดมินตัน', kcal: 650, perWeek: 3 },
          { id: uid(), name: 'เวทเล็กน้อย', kcal: 115, perWeek: 2 }
        ],
        entries: []
      },
      patt: {
        name: 'พัช', sex: '', age: '', height: '', goalWeight: '', deficit: 500, job: 'office',
        activities: [
          { id: uid(), name: 'เดินเร็ว', kcal: 140, perWeek: 3 }
        ],
        entries: []
      }
    }
  };
}

// Person data lives in Firestore (people/ton, people/patt); tab & chart mode are per-device prefs.
let S = defaults();
try { Object.assign(S, JSON.parse(localStorage.getItem(PREF_KEY)) || {}); } catch {}
const configured = firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('YOUR');
const fb = configured ? initializeApp(firebaseConfig) : null;
// The PIN is never stored in this (public) code: data lives at vault/{pin}/people/{id}
// and firestore.rules only allows the real PIN, so a wrong PIN is rejected by Firebase itself.
const db = fb && getFirestore(fb);
let pin = null, loaded = new Set(), dbError = null, pinError = '', unsubs = [];
try { pin = localStorage.getItem(PIN_KEY); } catch {}
const personDoc = id => doc(db, 'vault', pin, 'people', id);
const sharedDoc = () => doc(db, 'vault', pin, 'shared', 'foods');
let sharedError = null, editingFood = null, foodsView = 'food', mealDraft = null, allMeals = false;
const synced = {};

function save() {
  try { localStorage.setItem(PREF_KEY, JSON.stringify({ tab: S.tab, intakeRange: S.intakeRange })); } catch {}
  if (!pin || loaded.size < IDS.length) return;
  for (const id of IDS) {
    recordDay(S.people[id], todayStr(), false);
    pruneLog(S.people[id]);
    const json = JSON.stringify(S.people[id]);
    if (json === synced[id]) continue;
    synced[id] = json;
    setDoc(personDoc(id), JSON.parse(json)).catch(onDbError);
  }
}

// Daily kcal total plus that day's target, so a week's balance is judged against the target in effect each day.
// Today follows the live target; a past day keeps the target it had (or today's, if it never had one).
function recordDay(p, d, edited) {
  const items = dayItems(p, d);
  p.days ||= {};
  if (!items.length) { if (edited) delete p.days[d]; return; }
  const kcal = Math.round(items.reduce((s, x) => s + (+x.kcal || 0) * (x.qty ?? 1), 0));
  const live = Math.round(macros(p)?.kcal ?? 0);
  p.days[d] = { kcal, target: d === todayStr() ? live || p.days[d]?.target || 0 : p.days[d]?.target ?? live };
}

// Item-level logs only for ~13 months so the person doc stays well under Firestore's 1 MB; daily totals stay forever.
function pruneLog(p) {
  const cutoff = new Date(dayMs(todayStr()) - 400 * 864e5).toISOString().slice(0, 10);
  for (const d of Object.keys(p.log || {})) if (d < cutoff || !p.log[d].length) delete p.log[d];
}

// Older data kept only today's items under p.today; move them into the per-day log.
function moveToday(p) {
  if (!p.today) return;
  if (p.today.items?.length) { p.log ||= {}; if (!p.log[p.today.date]?.length) p.log[p.today.date] = p.today.items; }
  delete p.today;
}

function onDbError(err) {
  console.error(err);
  if (err.code === 'permission-denied') { lock('รหัสไม่ถูกต้อง'); return; }
  dbError = `เชื่อมต่อฐานข้อมูลไม่ได้ (${err.code || err.message})`;
  render();
}

function listen() {
  unsubs.forEach(u => u()); unsubs = []; loaded = new Set(); dbError = null;
  for (const id of IDS) {
    unsubs.push(onSnapshot(personDoc(id), snap => {
      if (snap.exists()) { S.people[id] = snap.data(); synced[id] = JSON.stringify(S.people[id]); dropMet(S.people[id]); moveToday(S.people[id]); }
      else { S.people[id] = defaults().people[id]; synced[id] = ''; }
      loaded.add(id);
      if (loaded.size === IDS.length) { syncLogs(); save(); }
      scheduleRender();
    }, onDbError));
  }
  // Shared "My Food" library for both people: vault/{pin}/shared/foods.
  // Maps keyed by id so each add/edit/usage bump is an atomic field update (no lost writes between two phones).
  let seeded = false;
  unsubs.push(onSnapshot(sharedDoc(), snap => {
    if (!snap.exists()) {
      if (!seeded) {
        seeded = true;
        setDoc(sharedDoc(), { foods: {}, uses: {} }, { merge: true }).catch(onSharedError);
      }
      return;
    }
    S.shared = snap.data(); sharedError = null;
    if (loaded.size === IDS.length) { syncLogs(); save(); }
    scheduleRender();
  }, onSharedError));
}

// Logged items keep a copy of their food's nutrition. When a My Food item or meal is edited, bring every logged
// line that uses it up to date (name, nutrition, and servings for the same amount + unit), then refresh daily totals.
// save() only writes when something actually changed, so this is a no-op on unrelated updates.
function syncLogs() {
  if (!S.shared) return;
  for (const id of IDS) {
    const p = S.people[id];
    for (const [d, items] of Object.entries(p?.log || {})) {
      for (const it of items) {
        const food = it.foodId && getFood(it.foodId);
        if (!food) continue;
        const u = unitsOf(food).find(u => u.k === (it.unit || 's'));
        Object.assign(it, { name: food.name, p: +food.p || 0, c: +food.c || 0, f: +food.f || 0, kcal: foodKcal(food) });
        if (u && it.amount != null) { it.qty = it.amount * u.r; it.unitName = u.n; }
      }
      recordDay(p, d, false);
    }
  }
}

function onSharedError(err) {
  console.error(err);
  sharedError = err.code || err.message;
  render();
}
const sharedWrite = data => updateDoc(sharedDoc(), data).catch(onSharedError);
function addFood(food) {
  const id = uid();
  sharedWrite({ [`foods.${id}`]: { ...food, created: Date.now() } });
  return id;
}

function unlock(code) {
  pin = code; pinError = '';
  try { localStorage.setItem(PIN_KEY, pin); } catch {}
  listen(); render();
}

function lock(msg = '') {
  unsubs.forEach(u => u()); unsubs = []; loaded = new Set();
  pin = null; pinError = msg; dbError = null; S.shared = null; sharedError = null;
  try { localStorage.removeItem(PIN_KEY); } catch {}
  render();
}

// Don't wipe a half-typed input when the other person's update arrives.
let renderPending = false;
function scheduleRender() {
  const a = document.activeElement;
  if (a && a.closest('#app') && /INPUT|SELECT/.test(a.tagName)) {
    if (!renderPending) { renderPending = true; a.addEventListener('blur', () => { renderPending = false; render(); }, { once: true }); }
    return;
  }
  render();
}

// ---------- calculations ----------
const sorted = p => [...p.entries].sort((a, b) => a.date.localeCompare(b.date));
const latest = p => { const e = sorted(p); return e.length ? e[e.length - 1] : null; };
const profileReady = p => p.sex && +p.age > 0 && +p.height > 0;

const actKcal = a => +a.kcal || 0;

// Older data could store an activity as MET × minutes; freeze it into a fixed kcal (net of BMR) at the latest weight.
function dropMet(p) {
  const w = latest(p)?.weight || 70;
  for (const a of p.activities || []) {
    if (a.mode === 'met') a.kcal = Math.round(Math.max(0, +a.met - 1) * w * ((+a.minutes || 0) / 60));
    delete a.mode; delete a.met; delete a.minutes;
  }
}

function calc(p, weight) {
  const w = weight ?? latest(p)?.weight;
  if (!w || !profileReady(p)) return null;
  const bmr = 10 * w + 6.25 * +p.height - 5 * +p.age + (p.sex === 'm' ? 5 : -161);
  const base = bmr * JOBS[p.job].f;
  const acts = p.activities.map(a => ({ ...a, burn: actKcal(a), perWeek: +a.perWeek || 0 }));
  const weekly = acts.reduce((s, a) => s + a.burn * a.perWeek, 0);
  const exPct = p.exPct ?? 75;
  const exPerDay = weekly / 7 * exPct / 100;
  const tdee = base + exPerDay;
  const deficit = +p.deficit || 0;
  const target = tdee - deficit;
  const floor = p.sex === 'm' ? 1500 : 1200;
  const bmi = w / ((+p.height / 100) ** 2);
  return { w, bmr, base, weekly, exPct, exPerDay, tdee, target, floor, bmi, expectedRate: Math.max(0, tdee - Math.max(target, floor)) * 7 / KCAL_PER_KG };
}

// Protein = g/kg bodyweight; fat = % of calories (WHO/IOM AMDR 20–35%); carbs = whatever is left.
function macros(p) {
  const r = calc(p);
  if (!r) return null;
  const kcal = Math.max(r.target, r.floor);
  const perKg = +(p.proteinPerKg ?? 1), fatPct = +(p.fatPct ?? 30);
  const protG = r.w * perKg, protK = protG * 4;
  const fatK = kcal * fatPct / 100, fatG = fatK / 9;
  const carbK = Math.max(0, kcal - protK - fatK), carbG = carbK / 4;
  const pct = k => k / kcal * 100;
  return { kcal, perKg, fatPct, w: r.w,
    prot: { g: protG, k: protK, pct: pct(protK) },
    carb: { g: carbG, k: carbK, pct: pct(carbK) },
    fat: { g: fatG, k: fatK, pct: pct(fatK) } };
}

const num = n => fmt(n, Number.isInteger(+n) ? 0 : 1);
const foodKcal = f => +f.kcal || (+f.p || 0) * 4 + (+f.c || 0) * 4 + (+f.f || 0) * 9;
const foodList = () => Object.entries(S.shared?.foods || {}).map(([id, f]) => ({ id, ...f }));
const usesOf = id => S.shared?.uses?.[id] || 0;
const STD_BY_ID = Object.fromEntries(STD_FOODS.map(f => [f.id, f]));
// A meal is a saved set of foods with amounts; it acts like one food ("1 ชุด") whose nutrition is the sum.
// Ingredients use the food's current values when it still exists, else the snapshot taken when added.
function mealTotals(items) {
  const t = { p: 0, c: 0, f: 0, kcal: 0 };
  for (const it of items || []) {
    const b = (it.foodId && (S.shared?.foods?.[it.foodId] || STD_BY_ID[it.foodId])) || it, q = it.qty ?? 1;
    t.p += (+b.p || 0) * q; t.c += (+b.c || 0) * q; t.f += (+b.f || 0) * q; t.kcal += foodKcal(b) * q;
  }
  for (const k in t) t[k] = Math.round(t[k] * 10) / 10;
  return t;
}
const mealFood = (id, m) => ({ id, name: m.name, serving: '1 ชุด', meal: true, n: (m.items || []).length, ...mealTotals(m.items) });
const mealList = () => Object.entries(S.shared?.meals || {}).map(([id, m]) => mealFood(id, m));
// Built-in foods can't be removed from the code, so "delete" hides them for both people (past logs keep their values).
const stdFoods = () => STD_FOODS.filter(f => !S.shared?.hidden?.[f.id]);
const allFoods = (withMeals = false) => [...(withMeals ? mealList() : []), ...foodList(), ...stdFoods()];
const getFood = id => S.shared?.foods?.[id] ? { id, ...S.shared.foods[id] } : S.shared?.meals?.[id] ? mealFood(id, S.shared.meals[id]) : STD_BY_ID[id];

// Best matches first: most eaten, then My Food over the reference list, then names that start with the query.
function searchFoods(q, withMeals) {
  q = q.trim().toLowerCase();
  if (!q) return [];
  const rank = f => [-usesOf(f.id), f.std ? 1 : 0, f.name.toLowerCase().startsWith(q) ? 0 : 1];
  return allFoods(withMeals).filter(f => f.name.toLowerCase().includes(q) || f.barcode?.includes(q)).sort((a, b) => {
    const x = rank(a), y = rank(b);
    for (let i = 0; i < x.length; i++) if (x[i] !== y[i]) return x[i] - y[i];
    return a.name.localeCompare(b.name, 'th');
  }).slice(0, 10);
}

// Query survives re-renders; results are drawn straight into the DOM so typing never loses focus.
const searchQ = {};
// A scanned barcode that wasn't in My Food waits here as a draft form until saved or a new search starts.
const scanDraft = {};
const foodSearch = (key, mode) => `<div class="search" data-search="${key}" data-mode="${mode}">
    <div class="searchrow"><input type="search" placeholder="ค้นหาอาหาร" value="${esc(searchQ[key] || '')}" autocomplete="off"><button type="button" class="scanbtn" data-scan aria-label="สแกนบาร์โค้ด"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M8 9v6M11 9v6M14 9v6M17 9v6" stroke-width="1.5"/></svg></button></div>
    <div class="results"></div>
  </div>`;

const macroLine = f => `${fmt(foodKcal(f))} kcal · P ${num(f.p || 0)} · C ${num(f.c || 0)} · F ${num(f.f || 0)}`;

// Measurable units convert through ml, taking 1 ml ≈ 1 g (close enough for drinks and everyday food).
const MEAS = [['g', 'กรัม', 1], ['ml', 'มล.', 1], ['oz', 'oz', 29.57], ['tsp', 'ช้อนชา', 5], ['tbsp', 'ช้อนโต๊ะ', 15], ['cup', 'ถ้วยตวง', 240], ['ladle', 'ทัพพี', 60]].map(([k, n, ml]) => ({ k, n, ml }));
const COUNT = ['ที่', 'จาน', 'ชาม', 'แก้ว', 'ถ้วย', 'ชิ้น', 'ฟอง', 'ลูก', 'ผล', 'ซอง', 'กล่อง', 'ขวด', 'แท่ง'];
const MEAS_BY = Object.fromEntries(MEAS.map(u => [u.k, u]));
const unitName = s => String(s || '').replace(/^1\s+/, '') || 'ที่';

// Nutrition is stored for one serving; g is that serving in grams/ml, which unlocks every measurable unit.
function unitsOf(f) {
  const own = MEAS_BY[f?.unit];
  const list = own ? [] : [{ k: 's', n: unitName(f?.serving), r: 1 }];
  if (+f?.g) {
    (f.units || []).forEach((u, i) => list.push({ k: 'u' + i, n: u.n, r: u.g / f.g }));
    MEAS.forEach(u => { if (!list.some(x => x.n === u.n)) list.push({ k: u.k, n: u.n, r: u.ml / f.g }); });
  }
  return list;
}

// Best guess of amount + unit for the form, also for older foods that only have a serving label.
function servingParts(v) {
  if (v.unit) return { amt: v.amt ?? 1, unit: v.unit };
  const str = String(v.serving || '');
  const m = str.match(/^([\d.]+)\s*(ก\.|กรัม|มล\.|oz)/i);
  if (m) return { amt: +m[1], unit: { 'ก.': 'g', 'กรัม': 'g', 'มล.': 'ml' }[m[2]] || 'oz' };
  const c = str.match(/^([\d.]+|½)\s*(\S+)/), name = c?.[2];
  const amt = c ? (c[1] === '½' ? 0.5 : +c[1]) : 1;
  const meas = MEAS.find(u => u.n === name);
  return meas ? { amt, unit: meas.k } : { amt, unit: COUNT.includes(name) ? name : 'ที่' };
}

const nutritionFields = (v = {}) => {
  const { amt, unit } = servingParts(v), counted = !MEAS_BY[unit];
  return `
      <label>ปริมาณ<input name="amt" type="number" step="any" min="0" value="${esc(v.name || v.amt != null ? amt : '')}" placeholder="1"></label>
      <label>หน่วย<select name="unit">
        <optgroup label="แปลงหน่วยได้">${MEAS.map(u => `<option value="${u.k}" ${unit === u.k ? 'selected' : ''}>${u.n}</option>`).join('')}</optgroup>
        <optgroup label="หน่วยนับ">${COUNT.map(n => `<option value="${n}" ${unit === n ? 'selected' : ''}>${n}</option>`).join('')}</optgroup>
      </select></label>
      <label class="cw" ${counted ? '' : 'hidden'}>≈ กรัม<input name="g" type="number" step="any" min="0" value="${esc(counted && v.g ? v.g : '')}" placeholder="ไม่บังคับ"></label>
      <label>โปรตีน ก.<input name="p" type="number" step="0.1" min="0" value="${esc(v.p ?? '')}"></label>
      <label>คาร์บ ก.<input name="c" type="number" step="0.1" min="0" value="${esc(v.c ?? '')}"></label>
      <label>ไขมัน ก.<input name="f" type="number" step="0.1" min="0" value="${esc(v.f ?? '')}"></label>
      <label>kcal<input name="kcal" type="number" min="0" value="${esc(v.kcal || '')}" placeholder="อัตโนมัติ"></label>
      <label class="wide">บาร์โค้ด<input name="barcode" inputmode="numeric" value="${esc(v.barcode ?? '')}" placeholder="ไม่บังคับ"></label>`;
};

function newFoodForm(root, v, note) {
  root.querySelector('.results').innerHTML = `<div class="empty">${note}</div>
      <form class="foodform addnew">
        <label class="wide">ชื่อ<input name="name" value="${esc(v.name || '')}" required></label>
        ${nutritionFields(v)}
        <button class="btn" type="submit">${root.dataset.mode === 'manage' ? 'เพิ่มเมนู' : 'เพิ่มและกิน'}</button>
      </form>`;
}

function drawResults(root) {
  const q = root.querySelector('input').value.trim(), out = root.querySelector('.results');
  const manage = root.dataset.mode === 'manage', draft = scanDraft[root.dataset.search];
  if (!q && draft) { newFoodForm(root, draft.v, draft.note); return; }
  if (!q && !manage) { out.innerHTML = ''; return; }
  // Empty search on the My Food tab: the 10 foods both people eat most, newest My Food filling in until there's history.
  const hits = q ? searchFoods(q, root.dataset.mode === 'eat')
    : [...foodList(), ...stdFoods()].filter(f => usesOf(f.id) || !f.std)
      .sort((a, b) => usesOf(b.id) - usesOf(a.id) || (b.created || 0) - (a.created || 0)).slice(0, 10);
  if (!q) { out.innerHTML = hits.length ? `<div class="mlabel">⭐ ยอดนิยม</div>${hits.map(f => resultRow(f, true)).join('')}` : ''; return; }
  if (!hits.length) { newFoodForm(root, { name: q }, `ไม่พบ “${esc(q)}” · เพิ่มเป็นเมนูใหม่`); return; }
  out.innerHTML = hits.map(f => resultRow(f, manage)).join('');
}

const timesEaten = id => usesOf(id) ? ` · กิน ${fmt(usesOf(id))} ครั้ง` : '';
const COPY_ICON = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>';
function resultRow(f, manage) {
  const body = `<span class="n">${f.meal ? '🍱 ' : ''}${esc(f.name)}${f.serving ? `<span class="s">${esc(f.serving)}${f.g && !MEAS_BY[f.unit] && !/^\d+\s*ก\.?$/.test(f.serving) ? ` · ${num(f.g)} ก.` : ''}</span>` : ''}${f.std ? '' : `<span class="tag">${f.meal ? 'Meal' : 'My'}</span>`}</span><span class="m">${macroLine(f)}${manage ? timesEaten(f.id) : ''}</span>`;
  if (!manage) return `<div class="res"><button class="res-main" data-pick="${f.id}">${body}</button></div>`;
  const acts = f.std
    ? `<button class="x" data-copystd="${f.id}" title="คัดลอกเป็นเมนูใหม่ใน My Food">${COPY_ICON}</button><button class="x" data-hidestd="${f.id}" title="ลบ">✕</button>`
    : `<button class="x" data-editfood="${f.id}" title="แก้ไข">✎</button><button class="x" data-dupfood="${f.id}" title="คัดลอกเป็นเมนูใหม่">${COPY_ICON}</button><button class="x" data-delfood="${f.id}" title="ลบ">✕</button>`;
  return `<div class="res"><div class="res-main">${body}</div>${acts}</div>`;
}

// Copy straight into My Food as "<name> (copy)" (no barcode, so a scan still finds one food); edit it later with ✎.
function duplicateFood(src) {
  const { id, std, cat, created, barcode, meal, n, ...f } = src;
  const name = `${src.name} (copy)`;
  addFood({ ...f, ...servingParts(src), name, barcode: null });
  return name;
}

function bindSearch(key, { pick, add }) {
  const root = document.querySelector(`[data-search="${key}"]`);
  if (!root) return;
  const input = root.querySelector('input');
  input.oninput = () => { searchQ[key] = input.value; delete scanDraft[key]; drawResults(root); };
  root.onclick = ev => {
    const t = ev.target.closest('button');
    if (!t) return;
    if (t.hasAttribute('data-scan')) scanInto(root, key, pick);
    else if (t.dataset.pick) { searchQ[key] = ''; pick(t.dataset.pick); }
    else if (t.dataset.editfood) { editingFood = t.dataset.editfood; render(); window.scrollTo(0, 0); }
    else if (t.dataset.dupfood || t.dataset.copystd) {
      if (sharedError || !S.shared) { alert('ใช้ My Food ไม่ได้ตอนนี้'); return; }
      const src = getFood(t.dataset.dupfood || t.dataset.copystd);
      const name = duplicateFood(src);
      // Keep the current search (the copy's name still matches it) so original and copy show side by side.
      if (!(searchQ[key] || '').trim()) searchQ[key] = name;
      render();
    }
    else if (t.dataset.delfood) {
      const id = t.dataset.delfood;
      if (confirm(`ลบ “${S.shared.foods[id].name}” ออกจาก My Food?`)) sharedWrite({ [`foods.${id}`]: deleteField(), [`uses.${id}`]: deleteField() });
    } else if (t.dataset.hidestd) {
      const id = t.dataset.hidestd;
      if (confirm(`ลบ “${STD_BY_ID[id].name}” ออกจากรายการอาหาร?`)) sharedWrite({ [`hidden.${id}`]: true });
    }
  };
  root.onsubmit = ev => {
    ev.preventDefault();
    const food = readFood(new FormData(ev.target));
    if (!food) return;
    searchQ[key] = ''; delete scanDraft[key];
    add(food);
  };
  drawResults(root);
}
// ---------- barcode scanning ----------
// iPhone Safari has no native BarcodeDetector, so load a WebAssembly polyfill (ZXing) only when someone scans.
let detectorP;
const getDetector = () => detectorP ||= import('https://cdn.jsdelivr.net/npm/barcode-detector@3.2.2/ponyfill/+esm')
  .then(m => new m.BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'qr_code'] }))
  .catch(e => { detectorP = null; throw e; });

// Live camera at the highest resolution Safari gives, scanning the middle band and the whole frame in turn.
// Fallbacks for blurry/dark cases: a photo from the native camera (autofocus, full resolution) or typing the digits.
function scanBarcode() {
  return new Promise(resolve => {
    const ov = document.createElement('div');
    ov.className = 'scanner';
    ov.innerHTML = `<video playsinline muted></video><div class="frame"></div>
      <div class="sbar"><div class="st">กำลังเปิดกล้อง…</div>
        <div class="sbtns"><label class="sb">📷 ถ่ายรูป<input type="file" accept="image/*" capture="environment" hidden></label>
        <button type="button" class="sb" data-type>⌨️ พิมพ์เลข</button><button type="button" class="sb" data-close>ปิด</button></div></div>`;
    document.body.append(ov);
    const video = ov.querySelector('video'), st = ov.querySelector('.st'), canvas = document.createElement('canvas');
    let stream, done = false, live = 0;
    const stopLive = () => { live++; stream?.getTracks().forEach(t => t.stop()); stream = null; };
    const finish = code => { if (done) return; done = true; stopLive(); ov.remove(); resolve(code); };
    const say = t => { if (!done) st.textContent = t; };
    ov.querySelector('[data-close]').onclick = () => finish(null);
    ov.querySelector('[data-type]').onclick = () => {
      const v = prompt('พิมพ์เลขใต้บาร์โค้ด');
      if (v && v.replace(/\D/g, '')) finish(v.replace(/\D/g, ''));
    };
    ov.querySelector('input[type=file]').onchange = async ev => {
      const file = ev.target.files?.[0];
      ev.target.value = '';
      if (!file) return;
      stopLive(); say('กำลังอ่านจากรูป…');
      try {
        const [det, img] = await Promise.all([getDetector(), createImageBitmap(file)]);
        const found = await det.detect(img);
        if (found.length) { finish(found[0].rawValue); return; }
        say('อ่านจากรูปไม่ได้ · ถ่ายใหม่ให้บาร์โค้ดชัดและเต็มภาพ หรือพิมพ์เลข');
      } catch { say('อ่านรูปไม่ได้ · ลองใหม่อีกครั้ง'); }
      startLive();
    };
    const startLive = async () => {
      const run = ++live;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: false,
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
      } catch { say('เปิดกล้องไม่ได้ · อนุญาตให้ Safari ใช้กล้อง หรือกด “ถ่ายรูป”'); return; }
      if (done || run !== live) { stream.getTracks().forEach(t => t.stop()); return; }
      stream.getVideoTracks()[0]?.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
      video.srcObject = stream;
      await video.play().catch(() => {});
      say('กำลังโหลดตัวอ่านบาร์โค้ด…');
      let det;
      try { det = await getDetector(); } catch { say('โหลดตัวอ่านไม่ได้ · เช็กอินเทอร์เน็ต'); return; }
      say('ถือห่างประมาณ 15–20 ซม. ให้ภาพชัด · แสงพอ');
      for (let n = 0; !done && run === live; n++) {
        let found = [];
        if (video.readyState >= 2 && video.videoWidth) {
          const w = video.videoWidth, h = video.videoHeight;
          if (n % 2) found = await det.detect(video).catch(() => []);
          else {
            const bh = Math.round(h * 0.45);
            canvas.width = w; canvas.height = bh;
            canvas.getContext('2d').drawImage(video, 0, Math.round((h - bh) / 2), w, bh, 0, 0, w, bh);
            found = await det.detect(canvas).catch(() => []);
          }
        }
        if (found.length) { finish(found[0].rawValue); return; }
        await new Promise(r => setTimeout(r, 80));
      }
    };
    startLive();
  });
}

// Only the barcode number is sent to Open Food Facts, to prefill name and nutrition for a new food.
async function lookupBarcode(code) {
  try {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 6000);
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,product_name_th,brands,serving_size,serving_quantity,quantity,nutriments`, { signal: ctl.signal });
    clearTimeout(timer);
    const j = await r.json(), pr = j.product;
    if (!pr) return null;
    const n = pr.nutriments || {};
    const per = +pr.serving_quantity && (n.proteins_serving != null || n['energy-kcal_serving'] != null) ? 'serving' : '100g';
    const val = k => n[`${k}_${per}`] == null ? '' : Math.round(n[`${k}_${per}`] * 10) / 10;
    const title = (pr.product_name_th || pr.product_name || '').trim(), brand = pr.brands?.split(',')[0]?.trim() || '';
    const name = !title ? brand : brand && brand.length <= 20 && !title.toLowerCase().includes(brand.toLowerCase()) ? `${brand} ${title}` : title;
    const ml = /ml|มล|\d\s*l\b/i.test(per === 'serving' ? pr.serving_size || '' : pr.quantity || '');
    return { name, amt: per === 'serving' ? +pr.serving_quantity : 100, unit: ml ? 'ml' : 'g',
      p: val('proteins'), c: val('carbohydrates'), f: val('fat'), kcal: val('energy-kcal') };
  } catch { return null; }
}

function trend(p) {
  // linear regression over the last 28 days → kg/week
  const e = sorted(p);
  if (e.length < 2) return null;
  const last = dayMs(e[e.length - 1].date);
  const pts = e.filter(x => dayMs(x.date) >= last - 28 * 864e5).map(x => [(dayMs(x.date) - last) / 864e5, +x.weight]);
  if (pts.length < 2) return null;
  const span = -pts[0][0];
  if (span < 7) return { span, perWeek: null };
  const n = pts.length, mx = pts.reduce((s, q) => s + q[0], 0) / n, my = pts.reduce((s, q) => s + q[1], 0) / n;
  const slope = pts.reduce((s, q) => s + (q[0] - mx) * (q[1] - my), 0) / pts.reduce((s, q) => s + (q[0] - mx) ** 2, 0);
  return { span, perWeek: slope * 7 };
}

// Planned path: straight line from the first weigh-in at the expected rate (computed at the start weight, so it doesn't drift) down to the goal.
function plan(p) {
  const e = sorted(p), goal = +p.goalWeight;
  if (!e.length || !goal) return null;
  const d0 = dayMs(e[0].date), w0 = +e[0].weight, rate = calc(p, w0)?.expectedRate;
  if (!rate || w0 <= goal) return null;
  const perDay = rate / 7;
  return { d0, w0, goal, rate, end: d0 + (w0 - goal) / perDay * 864e5, at: t => Math.max(goal, w0 - perDay * (t - d0) / 864e5) };
}

function planStatus(p) {
  const pl = plan(p), e = sorted(p);
  if (!pl) return '';
  const legend = `<span class="muted">┈ แผน −${fmt(pl.rate, 2)} กก./สัปดาห์</span>`;
  if (e.length < 2) return legend;
  const last = e[e.length - 1], diff = +last.weight - pl.at(dayMs(last.date));
  const st = Math.abs(diff) < 0.3 ? '<span class="good">ตามแผน</span>'
    : diff > 0 ? `<span class="bad">ช้ากว่าแผน ${fmt(diff, 1)} กก.</span>` : `<span class="good">เร็วกว่าแผน ${fmt(-diff, 1)} กก.</span>`;
  return `${legend} · ${st}`;
}

// Body-fat plan: from the first fat reading, assume the planned weekly weight loss is all fat.
function fatPlan(p) {
  const pts = sorted(p).filter(x => x.fat != null), goal = +p.goalFat;
  if (!pts.length || !goal) return null;
  const w0 = +pts[0].weight, f0 = +pts[0].fat, d0 = dayMs(pts[0].date), rate = calc(p, w0)?.expectedRate;
  if (!rate || f0 <= goal) return null;
  const fm0 = w0 * f0 / 100;
  // fat% after t weeks = (fm0 - rate·t) / (w0 - rate·t); solve for the goal
  const weeks = (fm0 - goal / 100 * w0) / (rate * (1 - goal / 100));
  const at = t => { const wk = Math.min(Math.max(0, (t - d0) / (7 * 864e5)), weeks); return (fm0 - rate * wk) / (w0 - rate * wk) * 100; };
  const end = d0 + weeks * 7 * 864e5, n = Math.max(2, Math.ceil(weeks));
  return { goal, end, at, points: Array.from({ length: n + 1 }, (_, i) => { const x = d0 + (end - d0) * i / n; return { x, y: at(x) }; }) };
}

function fatStatus(p) {
  const pl = fatPlan(p), pts = sorted(p).filter(x => x.fat != null);
  if (!pts.length) return '';
  const last = pts.at(-1), first = pts[0], chg = last.fat - first.fat;
  let out = `<span class="muted">ล่าสุด ${fmt(last.fat, 1)}%</span>`;
  if (pts.length > 1) out += ` · <span class="${chg < 0 ? 'good' : chg > 0 ? 'bad' : 'muted'}">${chg > 0 ? '+' : ''}${fmt(chg, 1)}%</span>`;
  if (pl && pts.length > 1) {
    const diff = last.fat - pl.at(dayMs(last.date));
    out += ' · ' + (Math.abs(diff) < 0.5 ? '<span class="good">ตามแผน</span>'
      : diff > 0 ? `<span class="bad">ช้ากว่าแผน ${fmt(diff, 1)}%</span>` : `<span class="good">เร็วกว่าแผน ${fmt(-diff, 1)}%</span>`);
  }
  return out;
}

function etaText(p) {
  const r = calc(p), t = trend(p), cur = latest(p)?.weight, goal = +p.goalWeight;
  if (!cur || !goal) return '–';
  if (cur <= goal) return '🎉 ถึงเป้า';
  const rate = t?.perWeek < 0 ? -t.perWeek : r?.expectedRate;
  if (!rate) return '–';
  const d = new Date(); d.setDate(d.getDate() + (cur - goal) / rate * 7);
  return d.toLocaleDateString('th-TH', { month: 'short', year: '2-digit' });
}

// Donut of the day's calories: protein slice centred at the top, grams printed inside each slice,
// total kcal in the middle.
const daySum = (p, d, k) => dayItems(p, d).reduce((s, x) => s + (+x[k] || 0) * (x.qty ?? 1), 0);

// Two progress rings: outer = kcal eaten vs target (a second red lap shows the overshoot), inner = protein.
function rings(m, kcal, prot) {
  const c = 120, ring = (r, w, frac, color) => {
    const L = 2 * Math.PI * r, f = Math.min(1, Math.max(0, frac));
    return f <= 0 ? '' : `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round"
      stroke-dasharray="${f >= 1 ? L : f * L} ${L}" transform="rotate(-90 ${c} ${c})"/>`;
  };
  const over = kcal - m.kcal, kf = kcal / m.kcal, pf = prot / m.prot.g;
  // Name each ring along its track just before 12 o'clock; dark text with a surface-coloured halo reads on both the grey track and the coloured arc.
  const pt = (r, deg) => { const a = deg * Math.PI / 180; return `${(c + r * Math.cos(a)).toFixed(1)} ${(c + r * Math.sin(a)).toFixed(1)}`; };
  const label = (id, r, text) => `<path id="${id}" d="M ${pt(r, -175)} A ${r} ${r} 0 0 1 ${pt(r, -97)}" fill="none"/>
    <text class="rt"><textPath href="#${id}" startOffset="100%" text-anchor="end">${text}</textPath></text>`;
  const uid2 = Math.random().toString(36).slice(2, 7);
  return `<svg class="rings" viewBox="0 0 240 240" role="img" aria-label="แคลอรี ${fmt(kcal)} จาก ${fmt(m.kcal)} kcal, โปรตีน ${fmt(prot)} จาก ${fmt(m.prot.g)} กรัม">
    <circle cx="${c}" cy="${c}" r="104" fill="none" stroke="var(--surface-2)" stroke-width="18"/>
    <circle cx="${c}" cy="${c}" r="80" fill="none" stroke="var(--surface-2)" stroke-width="18"/>
    ${ring(104, 18, kf, 'var(--c)')}${over > 0 ? ring(104, 18, kf - 1, 'var(--danger)') : ''}
    ${ring(80, 18, pf, 'var(--prot)')}
    ${label('rk' + uid2, 104, 'แคลอรี')}${label('rp' + uid2, 80, 'โปรตีน')}
    <text x="${c}" y="${c - 30}" text-anchor="middle" class="rl">${over > 0 ? 'เกิน' : 'เหลือ'}</text>
    <text x="${c}" y="${c + 2}" text-anchor="middle" class="rv ${over > 0 ? 'bad' : ''}">${fmt(Math.abs(m.kcal - kcal))}</text>
    <text x="${c}" y="${c + 30}" text-anchor="middle" class="rl">kcal</text></svg>`;
}

// One logged/meal line: name, free amount, and a unit picker that converts between the food's units.
function itemChip(x, ns = '') {
  const us = unitsOf(x.foodId ? getFood(x.foodId) : null), cur = x.unit || 's', amt = x.amount ?? x.qty ?? 1;
  const unit = us.some(u => u.k === cur)
    ? (us.length > 1 ? `<select data-${ns}unit="${x.id}">${us.map(u => `<option value="${u.k}" ${u.k === cur ? 'selected' : ''}>${esc(u.n)}</option>`).join('')}</select>` : `<em>${esc(us[0].n)}</em>`)
    : `<em>${esc(x.unitName || 'ที่')}</em>`;
  return `<span>${x.mealId || getFood(x.foodId)?.meal ? '🍱 ' : ''}${esc(x.name)}<input class="amt" type="number" inputmode="decimal" step="any" min="0" data-${ns}amt="${x.id}" value="${+(+amt).toFixed(2)}">${unit}<button class="x" data-${ns || 'un'}${ns ? 'del' : 'eat'}="${x.id}" title="ลบ">✕</button></span>`;
}
function setAmount(it, v) {
  const u = unitsOf(getFood(it.foodId)).find(u => u.k === (it.unit || 's'));
  it.qty = u ? v * u.r : (it.qty ?? 1) * v / (it.amount ?? it.qty ?? 1);
  it.amount = v;
}
// Switching unit keeps the same portion: 2 ทัพพี becomes 120 กรัม, then you adjust the number.
function setUnit(it, k) {
  const u = unitsOf(getFood(it.foodId)).find(u => u.k === k);
  if (!u) return false;
  const raw = (it.qty ?? 1) / u.r;
  it.amount = u.k === 'g' || u.k === 'ml' ? Math.round(raw) : Math.round(raw * 10) / 10 || 0.1;
  it.qty = it.amount * u.r; it.unit = u.k; it.unitName = u.n;
  return true;
}
const servingOf = f => { const own = MEAS_BY[f.unit]; return own ? { amount: f.amt, unit: own.k, unitName: own.n } : { amount: 1, unit: 's', unitName: unitName(f.serving) }; };

  if (sharedError) return `<div class="card">${rulesAlert()}</div>`;

  const ed = editingFood && S.shared.foods?.[editingFood];
  if (ed) return `<div class="card foods-page">
    <h2>แก้ไขเมนู</h2>
    <form class="foodform" id="editFood">
      <label class="wide">ชื่อ<input name="name" value="${esc(ed.name)}" required></label>
      ${nutritionFields(ed)}

      <button class="ghost" type="button" id="cancelEdit">ยกเลิก</button>
    </form>
  </div>`;

  const seg = `<div class="seg">${[['food', 'My Food'], ['meal', 'My Meal']].map(([k, l]) => `<button data-fview="${k}" class="${foodsView === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  const head = t => `<div class="person-head"><h2 style="margin:0">${t}</h2>${seg}</div>`;

    <div class="results">${meals.map(m => `<div class="res"><div class="res-main">
        <span class="n">${esc(m.name)}<span class="s">${m.n} รายการ</span></span><span class="m">${macroLine(m)}${timesEaten(m.id)}</span></div>
        <button class="x" data-editmeal="${m.id}" title="แก้ไข">✎</button><button class="x" data-delmeal="${m.id}" title="ลบ">✕</button></div>`).join('')
      || '<div class="empty">ยังไม่มี Meal · รวมเมนูที่กินด้วยกันบ่อย ๆ เป็นชุดเดียว เช่น อาหารเช้าประจำ</div>'}</div>
    ${sortedMeals.length > 10 ? `<button class="ghost sm" data-allmeals style="margin-top:10px">${allMeals ? 'แสดงแค่ยอดนิยม' : `ดูทั้งหมด (${sortedMeals.length})`}</button>` : ''}

}

    <div class="row" style="margin-top:14px"><button class="btn" id="saveMeal">บันทึก Meal</button><button class="ghost" id="cancelMeal">ยกเลิก</button></div>`;

function summaryCard(id) {
  const p = S.people[id];
  return `<div class="card person-card" style="--c:${C(id)}">
    <div class="person-head"><span class="pill"><span class="dot" style="background:${C(id)}"></span>${p.name}</span>
      <button class="ghost" data-go="${id}">รายละเอียด →</button></div>
    ${energyBlock(id)}
    ${progress(id)}
  </div>`;
}

function progress(id) {
  const p = S.people[id], e = sorted(p);
  if (!+p.goalWeight) return `<div class="alert">ยังไม่ได้ตั้งน้ำหนักเป้าหมาย · <a href="#" data-go="${id}" data-gosub="goals" style="color:inherit">ตั้งเป้า →</a></div>`;
  if (!e.length) return '';
  const start = +e[0].weight, cur = +e[e.length - 1].weight, goal = +p.goalWeight;
  const pct = start > goal ? Math.min(100, Math.max(0, (start - cur) / (start - goal) * 100)) : 100;
  return `<details class="prog" data-prog="${id}" ${openProg[id] ? 'open' : ''}>
    <summary>
      <div class="row" style="justify-content:space-between;font-size:13px"><span>🎯 ${fmt(start, 1)} → <b>${fmt(goal, 1)}</b> กก.</span><span class="muted">${fmt(pct)}% · เหลือ ${fmt(Math.max(0, cur - goal), 1)} กก. <span class="chev">▾</span></span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </summary>
    ${statsBlock(id, false)}
  </details>`;
}

function fatProgress(id) {
  const p = S.people[id], pts = sorted(p).filter(x => x.fat != null), goal = +p.goalFat;
  if (!pts.length) return '';
  if (!goal) return `<div class="alert">ยังไม่ได้ตั้ง % ไขมันเป้าหมาย · <a href="#" data-go="${id}" data-gosub="goals" style="color:inherit">ตั้งเป้า →</a></div>`;
  const start = +pts[0].fat, cur = +pts.at(-1).fat;
  const pct = start > goal ? Math.min(100, Math.max(0, (start - cur) / (start - goal) * 100)) : 100;
  return `<div class="prog">
    <div class="row" style="justify-content:space-between;font-size:13px"><span>🎯 ${fmt(start, 1)}% → <b>${fmt(goal, 1)}%</b></span><span class="muted">${fmt(pct)}% · เหลือ ${fmt(Math.max(0, cur - goal), 1)}%</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
  </div>`;
}

function goalCard(id) {
  const p = S.people[id], r = calc(p), cur = latest(p)?.weight;
  const exPct = p.exPct ?? 75, goal = +p.goalWeight;
  let eta = '';
  if (r && goal && cur > goal && r.expectedRate > 0) {
    const weeks = (cur - goal) / r.expectedRate, d = new Date();
    d.setDate(d.getDate() + weeks * 7);
    eta = `ต้องลดอีก <b>${fmt(cur - goal, 1)} กก.</b> · ที่ ~${fmt(r.expectedRate, 2)} กก./สัปดาห์ ใช้ประมาณ <b>${fmt(weeks)} สัปดาห์</b> (ราว ${d.toLocaleDateString('th-TH', { month: 'long', year: 'numeric' })})`;
  }
  const chips = (field, opts, val, unit = '') => `<div class="chips">${opts.map(v => `<button data-chip="${field}" data-v="${v}" class="${+val === v ? 'on' : ''}">${v}${unit}</button>`).join('')}</div>`;
  return `<div class="card">
    <h2>เป้าหมาย</h2>
    <div class="goal-grid">
      <label>น้ำหนักเป้าหมาย (กก.)<input type="number" data-f="goalWeight" step="0.5" value="${esc(p.goalWeight)}" placeholder="เช่น 70"></label>
      <label>% ไขมันเป้าหมาย<input type="number" data-f="goalFat" step="0.5" min="5" max="50" value="${esc(p.goalFat ?? '')}" placeholder="เช่น 15"></label>
      <label>ลดวันละ (kcal)<input type="number" data-f="deficit" step="50" min="0" max="1000" value="${esc(p.deficit)}">
        ${chips('deficit', [300, 400, 500], p.deficit)}</label>
      <label>นับแคลจากการออกกำลังกาย
        <select data-f="exPct">${[[100, '100% (นับเต็ม)'], [75, '75% (แนะนำ)'], [50, '50% (เผื่อเยอะ)'], [0, '0% (ไม่นับเลย)']].map(([v, l]) => `<option value="${v}" ${exPct == v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    </div>
    <div class="note">${eta || 'ตั้งน้ำหนักเป้าหมาย + ข้อมูลส่วนตัว + บันทึกน้ำหนัก เพื่อดูว่าจะถึงเป้าเมื่อไหร่'}</div>
  </div>`;
}

function quickAdd(id) {
  const last = latest(S.people[id]);
  return `<form class="weighform" data-add="${id}">
    <label class="wd">วันที่<input type="date" name="date" value="${todayStr()}" required></label>
    <label>น้ำหนัก (กก.)<input type="number" name="weight" step="0.1" min="20" max="300" placeholder="${last ? last.weight : '65.0'}" required></label>
    <label>% ไขมัน<input type="number" name="fat" step="0.1" min="3" max="70" placeholder="${last?.fat ?? 'ไม่บังคับ'}"></label>
    <button class="btn" type="submit">บันทึก</button>
  </form>`;
}

function insight(id) {
  const p = S.people[id], t = trend(p), r = calc(p);
  if (!r || !t || t.span < 14 || t.perWeek == null) return '';
  const realTdee = r.target + (-t.perWeek * KCAL_PER_KG / 7);
  const gap = realTdee - r.tdee;
  let msg;
  if (t.perWeek > -0.1) msg = 'น้ำหนักแทบไม่ลดใน 2–4 สัปดาห์ ลองเช็กว่ากินตามเป้าจริงไหม หรือลดเป้าลงอีก 150–200 kcal';
  else if (-t.perWeek > r.w * 0.01) msg = 'ลดเร็วเกิน ~1% ของน้ำหนัก/สัปดาห์ เสี่ยงเสียกล้ามเนื้อ ลองเพิ่มแคลอีก 150–250 kcal และกินโปรตีนให้พอ';
  else msg = 'กำลังลดในอัตราที่ดี ทำต่อไปได้เลย 👍';
  return `<div class="alert" style="border-color:${C(id)}">
    <b>TDEE จากผลจริง ≈ ${fmt(realTdee)} kcal</b> <span class="muted">(สูตรคำนวณได้ ${fmt(r.tdee)} · ต่างกัน ${gap > 0 ? '+' : ''}${fmt(gap)})</span><br>
    ${msg}<br><span class="muted">*ประเมินโดยสมมติว่ากินตามเป้า ${fmt(r.target)} kcal/วัน สม่ำเสมอ</span></div>`;
}

function lastDays(p, n) {
  const t0 = dayMs(todayStr());
  return Array.from({ length: n }, (_, i) => {
    const d = new Date(t0 - (n - 1 - i) * 864e5).toISOString().slice(0, 10);
    return { d, ...(p.days?.[d] || {}) };
  });
}

function intakeCard(id) {
  const n = S.intakeRange, logged = lastDays(S.people[id], n).filter(x => x.kcal != null);
  const bal = logged.reduce((s, x) => s + x.kcal - x.target, 0);
  const avg = logged.length ? logged.reduce((s, x) => s + x.kcal, 0) / logged.length : null;
  const seg = `<div class="seg">${[[7, '7 วัน'], [30, '30 วัน']].map(([k, l]) => `<button data-range="${k}" class="${n === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  return `<div class="card" style="margin-top:14px">
    <div class="person-head"><h2 style="margin:0">📊 แคลอรีรายวัน</h2>${seg}</div>
    <div class="intake-sum">
      <div><span class="l">รวม ${logged.length}/${n} วัน</span>${logged.length
        ? `<b class="${bal > 0 ? 'bad' : 'good'}">${bal > 0 ? 'เกิน' : 'ขาด'} ${fmt(Math.abs(bal))}</b><small>kcal</small>` : '<b class="muted">–</b>'}</div>
      <div><span class="l">เฉลี่ยต่อวัน</span>${avg == null ? '<b class="muted">–</b>' : `<b>${fmt(avg)}</b><small>kcal</small>`}</div>
    </div>
    <div class="chart-box short"><canvas id="intakeChart"></canvas></div>
  </div>`;
}

function drawFat(id) {
  const el = document.getElementById('fatChart');
  if (!el || !window.Chart) return;
  const p = S.people[id], pts = sorted(p).filter(x => x.fat != null), pl = fatPlan(p), goal = +p.goalFat;
  const text = css('--muted'), grid = css('--border'), col = css(id === 'ton' ? '--ton' : '--patt'), surface = css('--surface');
  const datasets = [{ data: pts.map(x => ({ x: dayMs(x.date), y: +x.fat, w: +x.weight })), borderColor: col, backgroundColor: col,
    borderWidth: 2.5, tension: .3, pointRadius: 3.5, pointHoverRadius: 6, pointBackgroundColor: surface, pointBorderColor: col, pointBorderWidth: 2 }];
  if (pl) datasets.push({ plan: true, data: pl.points, borderColor: col + '80', borderWidth: 1.5, borderDash: [3, 4], pointRadius: 0, pointHitRadius: 0, tension: .2 });
  const xEnd = Math.max(dayMs(pts.at(-1).date), dayMs(pts[0].date) + 7 * 864e5, pl ? pl.end : 0);
  charts.push(new Chart(el, {
    type: 'line', data: { datasets }, plugins: [tagPlugin],
    options: {
      responsive: true, maintainAspectRatio: false, interaction: { mode: 'nearest', intersect: false },
      layout: { padding: { top: 10, right: 8 } },
      plugins: { legend: { display: false }, tags: { goals: goal ? [{ y: goal, color: col, tag: `เป้า ${fmt(goal, 1)}%` }] : [] },
        tooltip: { filter: it => !it.dataset.plan, callbacks: {
        title: it => new Date(it[0].parsed.x).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }),
        label: it => `${fmt(it.parsed.y, 1)}% · ไขมัน ${fmt(it.raw.w * it.parsed.y / 100, 1)} กก.` } } },
      scales: {
        x: { type: 'linear', min: dayMs(pts[0].date) - 864e5 / 2, max: xEnd + 864e5 / 2,
          grid: { display: false }, border: { color: grid },
          ticks: { color: text, maxTicksLimit: 6, callback: v => new Date(v).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', timeZone: 'UTC' }) } },
        y: { grace: '15%', suggestedMin: goal || undefined, grid: { color: grid }, border: { display: false }, ticks: { color: text, maxTicksLimit: 6, callback: v => +v.toFixed(1) + '%' } }
      }
    }
  }));
}

function drawIntake(id) {
  const el = document.getElementById('intakeChart');
  if (!el || !window.Chart) return;
  const p = S.people[id], n = S.intakeRange, days = lastDays(p, n);
  const text = css('--muted'), grid = css('--border'), col = css('--good'), over = css('--danger');
  const nowTarget = Math.round(macros(p)?.kcal || 0);
  const WD = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
  const label = d => { const t = new Date(dayMs(d)); return n === 7 ? [WD[t.getUTCDay()], String(t.getUTCDate())] : String(t.getUTCDate()); };
  const soft = c => c + 'd9';
  charts.push(new Chart(el, {
    data: {
      labels: days.map(x => label(x.d)),
      datasets: [
        { type: 'bar', data: days.map(x => x.kcal ?? null), backgroundColor: days.map(x => soft(x.kcal > x.target ? over : col)), hoverBackgroundColor: days.map(x => x.kcal > x.target ? over : col),
          borderColor: css('--text'), borderWidth: days.map(x => x.d === viewDay() ? 2 : 0),
          borderRadius: 6, borderSkipped: false, barPercentage: n === 7 ? .55 : .75, categoryPercentage: 1 },
        { type: 'line', target: true, data: days.map(x => x.target || nowTarget || null), borderColor: text, borderWidth: 1.5,
          borderDash: [5, 4], pointRadius: 0, pointHitRadius: 0, stepped: 'middle', spanGaps: true }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      onClick: (_, els) => {
        if (!els.length) return;
        const d = days[els[0].index].d;
        // Re-render after Chart.js finishes this event; destroying the chart inside its own handler throws and can stall later charts.
        setTimeout(() => { goDay(d); render(); document.querySelector('.daynav')?.scrollIntoView({ block: 'center', behavior: 'smooth' }); });
      },
      onHover: (ev, els) => { ev.native.target.style.cursor = els.length ? 'pointer' : 'default'; },
      plugins: {
        legend: { display: false },
        tooltip: {
          filter: it => !it.dataset.target && it.raw != null,
          callbacks: {
            title: it => new Date(dayMs(days[it[0].dataIndex].d)).toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'short', timeZone: 'UTC' }),
            label: it => { const x = days[it.dataIndex], d = x.kcal - x.target; return `${fmt(x.kcal)} kcal · ${d > 0 ? 'เกิน' : 'ขาด'} ${fmt(Math.abs(d))}`; }
          }
        }
      },
      scales: {
        x: { grid: { display: false }, border: { color: grid }, ticks: { color: text, autoSkip: true, maxRotation: 0, maxTicksLimit: n === 7 ? 7 : 10 } },
        y: { beginAtZero: true, grace: '10%', grid: { color: grid }, border: { display: false }, ticks: { color: text, maxTicksLimit: 5 } }
      }
    }
  }));
}

const SUBS = [['today', 'วันนี้'], ['weight', 'น้ำหนัก'], ['goals', 'เป้าหมาย'], ['profile', 'ข้อมูลส่วนตัว']];

        ${e.length ? `<div class="scroll" style="max-height:420px;overflow-y:auto"><table class="log"><thead><tr><th>วันที่</th><th>กก.</th><th>±</th><th>ไขมัน</th><th>เป้า kcal</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : '<div class="muted">ยังไม่มีข้อมูล</div>'}

        <label>อายุ (ปี)<input type="number" data-f="age" value="${esc(p.age)}" min="10" max="100"></label>
        <label>ส่วนสูง (ซม.)<input type="number" data-f="height" value="${esc(p.height)}" min="100" max="230"></label>
        <label>ลักษณะงาน<select data-f="job">${Object.entries(JOBS).map(([k, j]) => `<option value="${k}" ${p.job === k ? 'selected' : ''}>${j.label}</option>`).join('')}</select></label>
      </div>
    </div>`;
  return `<div style="--c:${C(id)}">${nav}${body}</div>`;
}

// Goal lines are drawn here (not as datasets) so they never catch hover/tap tooltips.
// Also draws a name pill above each person's first weigh-in.
const tagPlugin = {
  id: 'tags',
  beforeDatasetsDraw(chart, _, opts) {
    const { ctx, chartArea: a, scales: { y } } = chart;
    (opts.goals || []).forEach(g => {
      const py = y.getPixelForValue(g.y);
      if (py < a.top || py > a.bottom) return;
      ctx.save();
      ctx.strokeStyle = g.color; ctx.lineWidth = 1.2; ctx.setLineDash([6, 5]);
      ctx.beginPath(); ctx.moveTo(a.left, py); ctx.lineTo(a.right, py); ctx.stroke();
      ctx.font = '500 11px "IBM Plex Sans Thai", sans-serif';
      ctx.fillStyle = g.color; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
      ctx.fillText(g.tag, a.right - 2, py - 4);
      ctx.restore();
    });
  },
  afterDatasetsDraw(chart) {
    const { ctx, chartArea: a } = chart;
    chart.data.datasets.forEach((ds, i) => {
      const meta = chart.getDatasetMeta(i);
      if (!ds.tag || meta.hidden || !meta.data.length) return;
      ctx.save();
      {
        const pt = meta.data[0];
        ctx.font = '600 12px "IBM Plex Sans Thai", sans-serif';
        const w = ctx.measureText(ds.tag).width + 16, h = 22;
        const x = Math.max(a.left, Math.min(pt.x - w / 2, a.right - w)), y = Math.max(a.top - 26, pt.y - h - 9);
        ctx.fillStyle = ds.borderColor;
        ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, 11) : ctx.rect(x, y, w, h); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(ds.tag, x + w / 2, y + h / 2 + 1);
      }
      ctx.restore();
    });
  }
};

function drawChart(canvasId, ids) {
  const el = document.getElementById(canvasId);
  if (!el || !window.Chart) return;
  const text = css('--muted'), grid = css('--border'), surface = css('--surface');
  const people = ids.map(id => ({ id, p: S.people[id], e: sorted(S.people[id]) })).filter(x => x.e.length);
  if (!people.length) { el.parentElement.innerHTML = '<div class="muted" style="display:grid;place-items:center;height:100%">ยังไม่มีข้อมูลน้ำหนัก — บันทึกได้ในแท็บของแต่ละคน</div>'; return; }
  const single = ids.length === 1, pl = single ? plan(people[0].p) : null;
  const allX = people.flatMap(x => x.e.map(v => dayMs(v.date))).concat(pl ? [pl.end] : []);
  const x0 = Math.min(...allX), x1 = Math.max(Math.max(...allX), x0 + 7 * 864e5);
  const datasets = [], goals = [];
  people.forEach(({ id, p, e }) => {
    const col = css(id === 'ton' ? '--ton' : '--patt');
    datasets.push({ label: p.name, tag: p.name, data: e.map(v => ({ x: dayMs(v.date), y: +v.weight })),
      borderColor: col, backgroundColor: col, borderWidth: 2.5, tension: .3,
      pointRadius: 3.5, pointHoverRadius: 6, pointBackgroundColor: surface, pointBorderColor: col, pointBorderWidth: 2 });
    if (+p.goalWeight) goals.push({ y: +p.goalWeight, color: col, tag: `เป้า ${p.name} ${fmt(p.goalWeight, 1)}` });
    if (pl) datasets.push({ label: 'แผน', plan: true, data: [{ x: pl.d0, y: pl.w0 }, { x: pl.end, y: pl.goal }],
      borderColor: col + '80', borderWidth: 1.5, borderDash: [3, 4], pointRadius: 0, pointHitRadius: 0, fill: false });
  });
  charts.push(new Chart(el, {
    type: 'line', data: { datasets }, plugins: [tagPlugin],
    options: {
      responsive: true, maintainAspectRatio: false, interaction: { mode: 'nearest', intersect: false },
      layout: { padding: { top: 34, right: 8 } },
      plugins: {
        legend: { display: false },
        tags: { goals },
        tooltip: { filter: it => !it.dataset.plan, callbacks: {
          title: it => new Date(it[0].parsed.x).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }),
          label: it => `${it.dataset.label}: ${fmt(it.parsed.y, 1)} กก.` } }
      },
      scales: {
        x: { type: 'linear', min: x0 - 864e5 / 2, max: x1 + 864e5 / 4, grid: { display: false }, border: { color: grid },
          ticks: { color: text, maxTicksLimit: 7, callback: v => new Date(v).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', timeZone: 'UTC' }) } },
        y: { grace: '8%', suggestedMin: goals.length ? Math.min(...goals.map(g => g.y)) : undefined, suggestedMax: goals.length ? Math.max(...goals.map(g => g.y)) : undefined, grid: { color: grid }, border: { display: false }, ticks: { color: text, callback: v => +v.toFixed(1) } }
      }
    }
  }));
}

// ---------- events ----------
function bind() {
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = ev => {
    ev.preventDefault(); setTab(b.dataset.go);
    if (b.dataset.gosub) { sub = b.dataset.gosub; render(); }
  });
  document.querySelectorAll('[data-sub]').forEach(b => b.onclick = () => { sub = b.dataset.sub; render(); window.scrollTo(0, 0); });
  document.querySelectorAll('details[data-prog]').forEach(d => d.ontoggle = () => { openProg[d.dataset.prog] = d.open; });
  document.querySelectorAll('[data-range]').forEach(b => b.onclick = () => { S.intakeRange = +b.dataset.range; save(); render(); });
  document.querySelectorAll('form[data-add]').forEach(f => f.onsubmit = ev => {
    ev.preventDefault();
    const p = S.people[f.dataset.add], fd = new FormData(f);
    const entry = { id: uid(), date: fd.get('date'), weight: +fd.get('weight'), ...(fd.get('fat') ? { fat: +fd.get('fat') } : {}) };
    const i = p.entries.findIndex(x => x.date === entry.date);
    if (i >= 0) p.entries[i] = { ...p.entries[i], ...entry, id: p.entries[i].id }; else p.entries.push(entry);
    save(); render();
  });
  bindFoods();
  const id = S.tab, p = S.people[id];
  if (!p) return;
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    if (!confirm('ลบรายการนี้?')) return;
    p.entries = p.entries.filter(x => x.id !== b.dataset.del); save(); render();
  });
  document.querySelectorAll('[data-f]').forEach(inp => inp.onchange = () => { p[inp.dataset.f] = inp.dataset.f === 'exPct' ? +inp.value : inp.value; save(); render(); });
  document.querySelectorAll('[data-chip]').forEach(b => b.onclick = ev => { ev.preventDefault(); p[b.dataset.chip] = +b.dataset.v; save(); render(); });
  const day = viewDay();
  const list = () => ((p.log ||= {})[day] ||= []);
  const changed = () => { recordDay(p, day, true); save(); render(); };
  const eat = item => {
    // A day that only had a total (from before per-day lists) keeps it as a line item, so adding food doesn't wipe it.
    if (!dayItems(p, day).length && p.days?.[day]?.kcal) list().push({ id: uid(), name: 'ยอดที่บันทึกไว้ก่อนหน้า', p: 0, c: 0, f: 0, kcal: p.days[day].kcal, qty: 1, amount: 1, unit: 's' });
    list().push({ id: uid(), qty: 1, ...item }); changed();
  };
  const eatFood = (fid, f) => {
    eat({ foodId: fid, name: f.name, p: +f.p || 0, c: +f.c || 0, f: +f.f || 0, kcal: foodKcal(f), ...servingOf(f) });
    sharedWrite({ [`uses.${fid}`]: increment(1) });
  };
  document.querySelectorAll('[data-uneat]').forEach(b => b.onclick = () => { p.log[day] = list().filter(x => x.id !== b.dataset.uneat); changed(); });
  const item = el => list().find(x => x.id === (el.dataset.amt || el.dataset.unit));
  document.querySelectorAll('[data-day]').forEach(b => b.onclick = () => {
    const n = +b.dataset.day;
    goDay(n ? new Date(dayMs(day) + n * 864e5).toISOString().slice(0, 10) : null); render();
  });
  const pick = document.querySelector('[data-pickday]');
  if (pick) pick.onchange = () => { if (pick.value) { goDay(pick.value); render(); } };
  document.querySelectorAll('[data-amt]').forEach(inp => inp.onchange = () => {
    const it = item(inp), v = +inp.value;
    if (!it || !(v > 0)) { render(); return; }
    setAmount(it, v); changed();
  });
  document.querySelectorAll('[data-unit]').forEach(sel => sel.onchange = () => { const it = item(sel); if (it && setUnit(it, sel.value)) changed(); });
  bindSearch('eat-' + id, {
    pick: fid => { const f = getFood(fid); if (f) eatFood(fid, f); },
    add: food => { if (S.shared && !sharedError) eatFood(addFood(food), food); else eat(food); }
  });
  document.querySelectorAll('[data-act]').forEach(row => {
    const a = p.activities.find(x => x.id === row.dataset.act);
    row.querySelectorAll('[data-a]').forEach(inp => inp.onchange = () => { a[inp.dataset.a] = inp.type === 'number' ? +inp.value : inp.value; save(); render(); });
  });
  document.querySelectorAll('[data-actdel]').forEach(b => b.onclick = () => { p.activities = p.activities.filter(x => x.id !== b.dataset.actdel); save(); render(); });
  const add = document.getElementById('addAct');
  if (add) add.onclick = () => { p.activities.push({ id: uid(), name: 'กิจกรรมใหม่', kcal: 200, perWeek: 1 }); save(); render(); };
}

function readFood(fd) {
  const name = (fd.get('name') || '').trim();
  const n = k => fd.get(k) === '' || fd.get(k) == null ? 0 : +fd.get(k);
  const amt = n('amt') || 1, unit = fd.get('unit') || 'ที่', meas = MEAS_BY[unit];
  const food = { name, p: n('p'), c: n('c'), f: n('f'), kcal: n('kcal'), amt, unit, barcode: (fd.get('barcode') || '').trim() || null,
    serving: `${num(amt)} ${meas ? meas.n : unit}`, g: meas ? amt * meas.ml : n('g') || null, units: [] };
  if (!name || !(food.p || food.c || food.f || food.kcal)) { alert('ใส่ชื่อ และค่าโภชนาการอย่างน้อย 1 ช่อง'); return null; }
  if (!food.kcal) food.kcal = Math.round(foodKcal(food));
  return food;
}

function bindFoods() {
  bindSearch('manage', { add: food => addFood(food) });
  document.querySelectorAll('[data-fview]').forEach(b => b.onclick = () => { foodsView = b.dataset.fview; render(); });
  const am = document.querySelector('[data-allmeals]');
  if (am) am.onclick = () => { allMeals = !allMeals; render(); };
  const nm = document.querySelector('[data-newmeal]');
  if (nm) nm.onclick = () => { mealDraft = { id: null, name: '', items: [] }; render(); };
  document.querySelectorAll('[data-editmeal]').forEach(b => b.onclick = () => {
    const m = S.shared.meals[b.dataset.editmeal];
    mealDraft = { id: b.dataset.editmeal, name: m.name, created: m.created, items: structuredClone(m.items || []) };
    render(); window.scrollTo(0, 0);
  });
  document.querySelectorAll('[data-delmeal]').forEach(b => b.onclick = () => {
    const id = b.dataset.delmeal;
    if (confirm(`ลบ Meal “${S.shared.meals[id].name}”?`)) sharedWrite({ [`meals.${id}`]: deleteField(), [`uses.${id}`]: deleteField() });
  });
  if (mealDraft && foodsView === 'meal') bindMealEditor();
  const ef = document.getElementById('editFood');
  if (ef) ef.onsubmit = ev => {
    ev.preventDefault();
    const food = readFood(new FormData(ef));
    if (!food) return;
    sharedWrite({ [`foods.${editingFood}`]: { ...S.shared.foods[editingFood], ...food } });
    editingFood = null; render();
  };
  const ce = document.getElementById('cancelEdit');
  if (ce) ce.onclick = () => { editingFood = null; render(); };
}

// The "≈ กรัม" field only matters for count units (จาน, ฟอง…); measurable units convert on their own.
document.addEventListener('change', ev => {
  if (ev.target.name !== 'unit' || !ev.target.closest('.foodform')) return;
  ev.target.closest('.foodform').querySelector('.cw').hidden = !!MEAS_BY[ev.target.value];
});

function bindMealEditor() {
  const nameEl = document.getElementById('mealName');
  if (nameEl) nameEl.oninput = () => { mealDraft.name = nameEl.value; };
  const addIng = (fid, f = getFood(fid)) => {
    if (!f) return;
    mealDraft.items.push({ id: uid(), foodId: fid, name: f.name, p: +f.p || 0, c: +f.c || 0, f: +f.f || 0, kcal: foodKcal(f), qty: 1, ...servingOf(f) });
    render();
  };
  bindSearch('meal', { pick: fid => addIng(fid), add: food => addIng(addFood(food), food) });
  const it = el => mealDraft.items.find(x => x.id === (el.dataset.mamt || el.dataset.munit || el.dataset.mdel));
  document.querySelectorAll('[data-mamt]').forEach(inp => inp.onchange = () => { const x = it(inp), v = +inp.value; if (x && v > 0) setAmount(x, v); render(); });
  document.querySelectorAll('[data-munit]').forEach(sel => sel.onchange = () => { const x = it(sel); if (x) setUnit(x, sel.value); render(); });
  document.querySelectorAll('[data-mdel]').forEach(b => b.onclick = () => { mealDraft.items = mealDraft.items.filter(x => x.id !== b.dataset.mdel); render(); });
  document.getElementById('cancelMeal').onclick = () => { mealDraft = null; render(); };
  document.getElementById('saveMeal').onclick = () => {
    const name = mealDraft.name.trim();
    if (!name) { alert('ตั้งชื่อ Meal ก่อน'); return; }
    if (!mealDraft.items.length) { alert('เพิ่มส่วนประกอบอย่างน้อย 1 รายการ'); return; }
    sharedWrite({ [`meals.${mealDraft.id || uid()}`]: { name, items: mealDraft.items, created: mealDraft.created || Date.now() } });
    mealDraft = null; render();
  };
}

function setTab(t) { S.tab = t; sub = 'today'; logDate = null; save(); render(); window.scrollTo(0, 0); }
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));

document.getElementById('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `tdee-backup-${todayStr()}.json` });
  a.click(); URL.revokeObjectURL(a.href);
};
document.getElementById('importFile').onchange = async ev => {
  const f = ev.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data.people?.ton || !data.people?.patt) throw 0;
    if (confirm('แทนที่ข้อมูลของทั้งสองคนด้วยไฟล์นี้?')) {
      S.people = data.people; IDS.forEach(id => { dropMet(S.people[id]); moveToday(S.people[id]); }); save();
      if (data.shared) setDoc(sharedDoc(), data.shared).catch(onSharedError);
      render();
    }
  } catch { alert('ไฟล์ไม่ถูกต้อง'); }
  ev.target.value = '';
};
document.getElementById('logoutBtn').onclick = () => lock();
// The home-screen app has no browser reload; refetch the app files past the HTTP cache, then reload.
document.getElementById('refreshBtn').onclick = async ev => {
  ev.currentTarget.classList.add('spin');
  await Promise.all(['./', './index.html', './foods-th.js', './firebase-config.js']
    .map(u => fetch(u, { cache: 'reload' }).catch(() => {})));
  location.reload();
};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
// Mobile Safari sometimes misses canvas resizes (rotation, pinch-zoom, back/forward cache) — force a refit.
let resizeTimer;
const refit = () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => charts.forEach(c => c.resize()), 150); };
addEventListener('resize', refit);
addEventListener('orientationchange', refit);
window.visualViewport?.addEventListener('resize', refit);
addEventListener('pageshow', e => { if (e.persisted) render(); });

if (configured && pin) listen();
render();
</script>
