// ---------- AI nutrition lookup ----------
// Claude estimates one serving from the typed name and/or a photo (dish or nutrition label) and fills the form for review.
// The API key is typed once per device and kept only in this browser's localStorage.
const AI_KEY = 'tdee-ai-key';
let aiClientP;
const aiKey = () => { try { return localStorage.getItem(AI_KEY) || ''; } catch { return ''; } };
function askAiKey() {
  const k = prompt('Claude API key (เก็บไว้ในเครื่องนี้เท่านั้น · เว้นว่างเพื่อลบ)', aiKey());
  if (k === null) return aiKey();
  try { k.trim() ? localStorage.setItem(AI_KEY, k.trim()) : localStorage.removeItem(AI_KEY); } catch {}
  aiClientP = null;
  return k.trim();
}
const getAi = () => aiClientP ||= import('https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.128.0/+esm')
  .then(m => new m.default({ apiKey: aiKey(), dangerouslyAllowBrowser: true }))
  .catch(e => { aiClientP = null; throw e; });

const AI_UNITS = [...MEAS.map(u => u.k), ...COUNT];
const AI_SCHEMA = {
  type: 'object', additionalProperties: false,
  required: ['name', 'amount', 'unit', 'grams', 'p', 'c', 'f', 'kcal', 'note'],
  properties: {
    name: { type: 'string' }, amount: { type: 'number' }, unit: { type: 'string', enum: AI_UNITS }, grams: { type: 'number' },
    p: { type: 'number' }, c: { type: 'number' }, f: { type: 'number' }, kcal: { type: 'number' }, note: { type: 'string' },
    parts: { type: 'array', items: { type: 'object', additionalProperties: false, required: ['name', 'amount', 'kcal'],
      properties: { name: { type: 'string' }, amount: { type: 'string' }, kcal: { type: 'number' } } } },
  },
};
AI_SCHEMA.required.push('parts');
const AI_SYSTEM = `You estimate nutrition for a calorie-tracking app used by two people in Bangkok. The user describes what they ate (Thai or English), and may attach a photo of the dish or of a nutrition label.

Return ONE serving exactly as described (e.g. "1 ลูก", "ชามพิเศษ", "2 ช้อนชา"); if no amount is given, use the usual single serving in Thailand.
- Nutrition label photo: use the label's own numbers and its kcal as printed (do not recompute kcal from macros). Scale if the user names a different amount. Carbohydrate = total carbohydrate as printed.
- Dish photo or description: estimate realistic Thai street-food / restaurant portions, including cooking oil, sauces and sugar, and whether soup/broth is eaten as described. Base values on Thai FDA, INMUCAL (Mahidol) or USDA data.
- kcal is the real energy of the food; fiber and sugar alcohols add little, so kcal may be below 4/4/9 of the macros.
- unit: g or ml when the serving is naturally weighed or is a drink of known volume; otherwise a Thai count unit from the list (ที่, จาน, ชาม, แก้ว, ลูก, ชิ้น, ขวด, ...). Codes: g=grams, ml=millilitres, tsp=teaspoon 5 ml, tbsp=tablespoon 15 ml, cup=240 ml, ladle=Thai rice ladle 60 g, oz=fluid ounce.
- amount: the number of those units in the serving. grams: weight of the whole serving in g (ml for drinks), your best estimate; 0 only if impossible to tell.
- name: short Thai name people would search for, with brand and key modifiers (e.g. ไม่เติมน้ำตาล, ไม่กินน้ำซุป).
- note: one short Thai sentence (under 80 characters) with the main assumption, e.g. portion size or data source.
- Protein/carbs/fat in grams to 1 decimal; kcal as an integer.
- Dipping sauces, dressings, soups, drinks and side dishes served separately are often not finished. Unless the user says otherwise, count only a typical eaten amount (e.g. dipping sauce 1-2 tbsp, not the whole cup) - never assume a side container was emptied.
- Amounts the user states override what the photo suggests.
- parts: every component you counted, each with the amount counted (Thai, e.g. "~150 ก.", "1 ช้อนโต๊ะ") and its kcal; the parts must add up to kcal.
- A message may include your previous estimate and a correction from the user: apply the correction and keep the rest of the estimate unless it must change.`;

// Opens the photo picker (camera or library) and returns a downscaled JPEG as base64, or null if cancelled.
function pickPhoto() {
  const input = Object.assign(document.createElement('input'), { type: 'file', accept: 'image/*' });
  const picked = new Promise(resolve => {
    input.onchange = () => resolve(input.files[0] || null);
    input.addEventListener('cancel', () => resolve(null));
  });
  input.click();
  return picked.then(async file => {
    if (!file) return null;
    const bmp = await createImageBitmap(file), k = Math.min(1, 1568 / Math.max(bmp.width, bmp.height));
    const c = Object.assign(document.createElement('canvas'), { width: Math.round(bmp.width * k), height: Math.round(bmp.height * k) });
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return { type: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.85).split(',')[1] };
  });
}

async function aiNutrition(desc, img, prev, fix, signal) {
  const client = await getAi();
  const content = [];
  if (img) content.push({ type: 'image', source: { type: 'base64', media_type: img.type, data: img.data } });
  let text = desc || 'ประเมินจากรูปนี้';
  if (prev) text += `\n\nPrevious estimate: ${JSON.stringify(prev)}\nCorrection from the user: ${fix}`;
  content.push({ type: 'text', text });
  const res = await client.beta.messages.create({
    model: 'claude-opus-5-5', max_tokens: 8000,
    betas: ['server-side-fallback-2026-07-01'], fallbacks: 'default',
    output_config: { effort: 'low', format: { type: 'json_schema', schema: AI_SCHEMA } },
    system: AI_SYSTEM, messages: [{ role: 'user', content }],
  }, { signal });
  if (res.stop_reason === 'refusal') throw new Error('AI ไม่ตอบคำขอนี้');
  if (res.stop_reason === 'max_tokens') throw new Error('AI ตอบไม่จบ ลองใหม่อีกครั้ง');
  return JSON.parse(res.content.find(b => b.type === 'text').text);
}

const aiError = e => e.status === 401 ? 'API key ไม่ถูกต้อง · แก้ที่ปุ่ม ✨ AI key ด้านล่าง'
  : e.status === 429 ? 'ใช้งานถี่เกินไป ลองใหม่อีกสักครู่'
  : e.status === 400 && /credit/i.test(e.message) ? 'เครดิต API หมด · เติมที่ console.anthropic.com'
  : e.status ? `AI ผิดพลาด (${e.status})` : e.message?.startsWith('AI') ? e.message : 'เชื่อมต่อ AI ไม่ได้ ลองใหม่อีกครั้ง';

function fillFromAi(form, r) {
  const set = (n, v) => { const el = form.elements[n]; if (!el) return; el.value = v; el.dispatchEvent(new Event(el.tagName === 'SELECT' ? 'change' : 'input', { bubbles: true })); };
  const r1 = v => Math.round((+v || 0) * 10) / 10;
  set('name', r.name);
  set('amt', r1(r.amount) || 1);
  set('unit', AI_UNITS.includes(r.unit) ? r.unit : 'ที่');
  set('g', !MEAS_BY[r.unit] && r.grams > 0 ? Math.round(r.grams) : '');
  set('p', r1(r.p)); set('c', r1(r.c)); set('f', r1(r.f)); set('kcal', Math.round(+r.kcal || 0));
}

}

async function runAi(form, desc, img, fix) {
  const note = form.querySelector('.ainote'), btns = form.querySelectorAll('[data-ai],[data-aiphoto],[data-aifix]');
  btns.forEach(x => x.disabled = true);
  note.textContent = fix ? 'AI กำลังแก้…' : img ? 'AI กำลังดูรูป…' : 'กำลังถาม AI…';
  try {
    const r = await aiNutrition(desc, img, fix?.prev, fix?.fix);
    if (!form.isConnected) return;
    form.aiLast = { desc, img, result: r };
    fillFromAi(form, r);
    showAi(form, r);
  } catch (e) {
    console.warn(e);
    note.textContent = aiError(e);
  } finally { btns.forEach(x => x.disabled = false); }
}


document.getElementById('aiKeyBtn').onclick = () => { const had = aiKey(), k = askAiKey(); if (k !== had) alert(k ? 'บันทึก API key แล้ว' : 'ลบ API key แล้ว'); };

// A half-filled food form survives switching apps: iOS may re-render or even reload the page meanwhile.
// The draft lives only on this device and is cleared on save/cancel.
const DRAFT_KEY = 'tdee-draft', DRAFT_TTL = 3 * 3600e3, PAGE_KEY = 'tdee-page';
// The page on screen (tab + sub-tab) is remembered on this device so a refresh or reload comes back to it.
const pageKey = () => S.tab === 'foods' ? 'foods/' + foodsView : S.tab === 'overview' ? 'overview' : S.tab + '/' + sub;
function rememberPage() {
  try { localStorage.setItem(PAGE_KEY, JSON.stringify({ tab: S.tab, sub, foodsView })); } catch {}
  // Leaving the page a draft belongs to drops it, so it can't pull a later reload back to an old form.
  if (formDraft && formDraft.page !== pageKey()) clearDraft();
  if (sheet && (S.tab !== sheet.id || sub !== 'today')) { sheet.ctrl?.abort(); sheet = null; saveSheet(); }
  document.body.classList.toggle('noscroll', !!document.querySelector('.sheet'));
  fitSheet();
}
function fitSheet() {
  const bg = document.querySelector('.sheet-bg'), vv = window.visualViewport;
  if (!bg || !vv) return;
  bg.style.top = vv.offsetTop + 'px'; bg.style.height = vv.height + 'px';
}
window.visualViewport?.addEventListener('resize', fitSheet);
document.addEventListener('focusin', ev => {
  if (ev.target.closest?.('.sheet') && /INPUT|TEXTAREA|SELECT/.test(ev.target.tagName)) setTimeout(() => { fitSheet(); ev.target.scrollIntoView({ block: 'center' }); }, 350);
});
window.visualViewport?.addEventListener('scroll', fitSheet);
let formDraft = null;
try { formDraft = JSON.parse(localStorage.getItem(DRAFT_KEY)); } catch {}
if (!formDraft || Date.now() - (formDraft.at || 0) > DRAFT_TTL) formDraft = null;
function formCtx(form) {
  if (form.id === 'editFood') return { kind: 'edit', editingFood };
  const key = form.closest('[data-search]')?.dataset.search;
  return key && key !== 'meal' ? { kind: 'new', key, q: searchQ[key] || '', scan: scanDraft[key] || null, meal: sheet?.meal || null } : null;
}
function saveDraft(form) {
  const ctx = formCtx(form);
  if (!ctx) return;
  formDraft = { ...ctx, page: pageKey(), logDate, values: Object.fromEntries(new FormData(form)), at: Date.now() };
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify(formDraft)); } catch {}
}
function clearDraft() {
  formDraft = null;
  try { localStorage.removeItem(DRAFT_KEY); } catch {}
}
function restoreDraft() {
  if (!formDraft) return;
  for (const form of document.querySelectorAll('#app form.foodform')) {
    const c = formCtx(form);
    if (!c || c.kind !== formDraft.kind) continue;
    if (c.kind === 'edit' ? c.editingFood !== formDraft.editingFood : c.key !== formDraft.key || c.q !== formDraft.q) continue;
    for (const [k, v] of Object.entries(formDraft.values)) if (form.elements[k]) form.elements[k].value = v;
    form.querySelector('.cw').hidden = !!MEAS_BY[form.elements.unit.value];
  }
}
['input', 'change'].forEach(t => document.addEventListener(t, ev => {
  const form = ev.target.closest?.('#app form.foodform');
  if (form) saveDraft(form);
}));

function bindMealEditor() {
  const nameEl = document.getElementById('mealName');
  if (nameEl) nameEl.oninput = () => { mealDraft.name = nameEl.value; };
  const addIng = (fid, f = getFood(fid), o) => {
    if (!f) return;
    mealDraft.items.push({ id: uid(), ...lineFor(fid, f, o) });
    render();
  };
  bindSearch('meal', { pick: (fid, o) => addIng(fid, undefined, o), add: food => addIng(addFood(food), food) });
  const it = el => mealDraft.items.find(x => x.id === (el.dataset.mamt || el.dataset.munit || el.dataset.mdel));
  document.querySelectorAll('[data-mamt]').forEach(inp => inp.onchange = () => { const x = it(inp), v = +inp.value; if (x && v > 0) setAmount(x, v); render(); });
  document.querySelectorAll('[data-munit]').forEach(sel => sel.onchange = () => { const x = it(sel); if (x) setUnit(x, sel.value); render(); });
  document.querySelectorAll('[data-mdel]').forEach(b => b.onclick = () => { mealDraft.items = mealDraft.items.filter(x => x.id !== b.dataset.mdel); render(); });
  document.querySelectorAll('[data-mrow]').forEach(row => row.addEventListener('click', e => {
    if (e.target.closest('input,select,button')) return;
    openItem = openItem === row.dataset.mrow ? null : row.dataset.mrow; render();
  }));
  document.getElementById('cancelMeal').onclick = () => { mealDraft = null; render(); };
  document.getElementById('saveMeal').onclick = () => {
    const name = mealDraft.name.trim();
    if (!name) { alert('ตั้งชื่อ Meal ก่อน'); return; }
    if (!mealDraft.items.length) { alert('เพิ่มส่วนประกอบอย่างน้อย 1 รายการ'); return; }
    sharedWrite({ [`meals.${mealDraft.id || uid()}`]: { name, items: mealDraft.items, created: mealDraft.created || Date.now() } });
    mealDraft = null; render();
  };
}

function setTab(t) { S.tab = t; sub = 'today'; logDate = null; addMeal = null; openItem = null; save(); render(); window.scrollTo(0, 0); }
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));

document.getElementById('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `tdee-backup-${todayStr()}.json` });
  a.click(); URL.revokeObjectURL(a.href);
};
document.getElementById('importFile').onchange = async ev => {
  const f = ev.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data.people?.ton || !data.people?.patt) throw 0;
    if (confirm('แทนที่ข้อมูลของทั้งสองคนด้วยไฟล์นี้?')) {
      S.people = data.people; IDS.forEach(id => { dropMet(S.people[id]); moveToday(S.people[id]); }); save();
      if (data.shared) setDoc(sharedDoc(), data.shared).catch(onSharedError);
      render();
    }
  } catch { alert('ไฟล์ไม่ถูกต้อง'); }
  ev.target.value = '';
};
document.getElementById('logoutBtn').onclick = () => lock();
// The home-screen app has no browser reload; refetch the app files past the HTTP cache, then reload.
document.getElementById('refreshBtn').onclick = async ev => {
  ev.currentTarget.classList.add('spin');
  await Promise.all(['./', './index.html', './foods-th.js', './firebase-config.js']
    .map(u => fetch(u, { cache: 'reload' }).catch(() => {})));
  location.reload();
};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
// Mobile Safari sometimes misses canvas resizes (rotation, pinch-zoom, back/forward cache) — force a refit.
let resizeTimer;
const refit = () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => charts.forEach(c => c.resize()), 150); };
addEventListener('resize', refit);
addEventListener('orientationchange', refit);
window.visualViewport?.addEventListener('resize', refit);
addEventListener('pageshow', e => { if (e.persisted) render(); });

try {
  const pg = JSON.parse(localStorage.getItem(PAGE_KEY));
  if (pg?.tab === S.tab) { sub = pg.sub || sub; foodsView = pg.foodsView || foodsView; }
} catch {}
// A half-filled form reopens only on the page it was typed on.
if (formDraft?.page === pageKey()) {
  logDate = formDraft.logDate || null;
  if (formDraft.kind === 'edit') editingFood = formDraft.editingFood;
  else { searchQ[formDraft.key] = formDraft.q; if (formDraft.scan) scanDraft[formDraft.key] = formDraft.scan; }
  // A form typed in the add sheet reopens the sheet for the same meal.
  if (formDraft.key?.startsWith('eat-')) { sheet = { id: formDraft.key.slice(4), meal: formDraft.meal || autoMeal(), mode: 'search' }; addMeal = sheet.meal; }
}
try {
  const sv = JSON.parse(localStorage.getItem(SHEET_KEY));
  if (sv && !sheet && sv.page === pageKey() && Date.now() - sv.at < DRAFT_TTL) { sheet = { id: sv.id, meal: sv.meal, mode: 'result', desc: sv.desc, result: sv.result }; addMeal = sv.meal; }
} catch {}
if (configured && pin) listen();
render();
</script>
</body>
