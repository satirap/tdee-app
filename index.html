<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TDEE ต้น & พัช</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface-2:#f0eee9; --text:#1d1c1a; --muted:#6b6862;
  --border:#e2dfd8; --ton:#2f6fdb; --patt:#e0613f; --good:#1f8a5b; --warn:#b7791f; --danger:#c43d3d;
  --ton-soft:rgba(47,111,219,.12); --patt-soft:rgba(224,97,63,.12);
  --prot:#1f8a5b; --carb:#c9941a; --fat:#8a63d2; --on-macro:#fff;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141413; --surface:#1e1d1b; --surface-2:#282724; --text:#eceae4; --muted:#9d9a92;
    --border:#34322e; --ton:#6b9bf0; --patt:#f08766; --good:#4cc38a; --warn:#e0a84a; --danger:#ef6b6b;
    --ton-soft:rgba(107,155,240,.16); --patt-soft:rgba(240,135,102,.16);
    --prot:#4cc38a; --carb:#e6b949; --fat:#a98bf0; --on-macro:#141413;
  }
}
:root[data-theme="dark"]{
  --bg:#141413; --surface:#1e1d1b; --surface-2:#282724; --text:#eceae4; --muted:#9d9a92;
  --border:#34322e; --ton:#6b9bf0; --patt:#f08766; --good:#4cc38a; --warn:#e0a84a; --danger:#ef6b6b;
  --ton-soft:rgba(107,155,240,.16); --patt-soft:rgba(240,135,102,.16);
  --prot:#4cc38a; --carb:#e6b949; --fat:#a98bf0; --on-macro:#141413;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Thai",system-ui,sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:22px;margin:0;font-weight:700}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--muted)}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 8px}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px}
.tabs button{border:0;background:transparent;color:var(--muted);padding:7px 16px;border-radius:9px;font:inherit;font-weight:500;cursor:pointer}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.person-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.pill{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:17px}
.dot{width:12px;height:12px;border-radius:50%}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:8px 0 14px}
.stat{background:var(--surface-2);border-radius:10px;padding:10px 12px;min-width:0}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .v small{font-size:12px;font-weight:500;color:var(--muted)}
.person-card{border-top:4px solid var(--c)}
.donut{display:block;width:100%;max-width:250px;margin:4px auto 0}
.donut text{font-family:inherit;dominant-baseline:middle}
.donut .dl{font-size:11px;font-weight:500;fill:var(--on-macro)}
.donut .dg{font-size:13px;font-weight:700}
.donut .dc{font-size:36px;font-weight:700;fill:var(--c)}
.donut .du{font-size:12px;fill:var(--muted)}
.energy-sub{text-align:center;font-size:13px;color:var(--muted);margin:2px 0 4px}
details.prog{margin-top:14px;border-top:1px solid var(--border);padding-top:12px}
details.prog summary{list-style:none;cursor:pointer}
details.prog summary::-webkit-details-marker{display:none}
details.prog .chev{display:inline-block;transition:transform .15s}
details.prog[open] .chev{transform:rotate(180deg)}
details.prog .stats{margin-bottom:0;grid-template-columns:repeat(3,1fr)}
details.prog .stat .v{font-size:17px}
.chart-box.tall{height:380px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
input,select{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:7px 10px;min-width:0;width:100%}
input:focus,select:focus{outline:2px solid var(--c,var(--ton));outline-offset:-1px}
button.btn{font:inherit;font-weight:600;border:0;border-radius:9px;padding:8px 16px;cursor:pointer;background:var(--c,var(--ton));color:#fff}
button.ghost{font:inherit;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:9px;padding:6px 12px;cursor:pointer}
button.x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 6px}
button.x:hover{color:var(--danger)}
.bar{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px}
.goal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chips button{font:inherit;font-size:13px;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:99px;padding:3px 11px;cursor:pointer}
.chips button.on{background:var(--c);border-color:var(--c);color:#fff}
.foods{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.foods button{font:inherit;font-size:13px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;padding:5px 10px;cursor:pointer;text-align:left;line-height:1.3}
.foods button small{display:block;color:var(--muted);font-size:11px}
.foods button:hover{border-color:var(--prot)}
.eaten{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.eaten span{font-size:12px;background:var(--surface-2);border-radius:99px;padding:2px 4px 2px 10px}
.meter{margin:8px 0}
.meter .row{justify-content:space-between;font-size:13px}
.meter .bar i{background:var(--m)}
.breakdown{font-size:13px;color:var(--muted);line-height:1.8}
.breakdown b{color:var(--text);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .good{color:var(--good)} .bad{color:var(--danger)} .warn{color:var(--warn)}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.alert{background:var(--surface-2);border-left:3px solid var(--warn);padding:8px 12px;border-radius:6px;font-size:13px;margin-top:10px}
.chart-box{position:relative;height:340px;overflow:hidden;width:100%;min-width:0}
.chart-box canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;padding:4px 12px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text)}
table.log{width:100%;border-collapse:collapse;font-size:14px}
table.log th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--border)}
table.log td{padding:7px 8px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.act{display:grid;grid-template-columns:1.4fr 1fr 1.6fr .8fr auto;gap:6px;align-items:end;padding:8px 0;border-bottom:1px dashed var(--border)}
.act .dual{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pf{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
footer{margin-top:24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.hidden{display:none!important}
.center{max-width:420px;margin:60px auto;text-align:center}
.center p{color:var(--muted)}
@media (max-width:560px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .act{grid-template-columns:1fr 1fr}
  .act .dual{grid-column:1/-1}
  .chart-box,.chart-box.tall{height:280px}
  .tabs button{padding:7px 12px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>TDEE Tracker<small>ลดไขมัน · ต้น & พัช</small></h1>
    <nav class="tabs hidden" id="tabs">
      <button data-tab="overview">ภาพรวม</button>
      <button data-tab="ton">ต้น</button>
      <button data-tab="patt">พัช</button>
    </nav>
  </header>
  <main id="app"></main>
  <footer id="footer" class="hidden">
    <button class="ghost" id="logoutBtn">🔒 ล็อก</button>
    <button class="ghost" id="exportBtn">⬇︎ Export ข้อมูล (JSON)</button>
    <label class="ghost" style="flex-direction:row;cursor:pointer;border:1px solid var(--border);border-radius:9px;padding:6px 12px;color:var(--text);font-size:15px">⬆︎ Import<input type="file" id="importFile" accept=".json" hidden></label>
    <span>ข้อมูลซิงก์ผ่าน Firebase · Export ไว้สำรองเป็นระยะ</span>
  </footer>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, doc, onSnapshot, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { firebaseConfig } from './firebase-config.js';

const PREF_KEY = 'tdee-prefs-v1';
const PIN_KEY = 'tdee-pin';
const IDS = ['ton', 'patt'];
const KCAL_PER_KG = 7700;
const JOBS = {
  office: { f: 1.2,  label: 'นั่งโต๊ะเป็นหลัก (office)' },
  light:  { f: 1.3,  label: 'ยืน/เดินระหว่างวัน (ไม่ใช่ office)' },
  active: { f: 1.45, label: 'ใช้แรง/เดินเกือบทั้งวัน' }
};
const uid = () => Math.random().toString(36).slice(2, 9);
const todayStr = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const dayMs = d => Date.parse(d + 'T00:00:00Z');
const fmt = (n, d = 0) => n == null || isNaN(n) ? '–' : Number(n).toLocaleString('th-TH', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtDate = s => new Date(dayMs(s)).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit', timeZone: 'UTC' });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function defaults() {
  return {
    tab: 'overview', chartMode: 'kg',
    people: {
      ton: {
        name: 'ต้น', sex: '', age: '', height: '', goalWeight: '', deficit: 500, job: 'light',
        activities: [
          { id: uid(), name: 'ตีแบดมินตัน', mode: 'kcal', kcal: 650, met: 7, minutes: 90, perWeek: 3 },
          { id: uid(), name: 'เวทเล็กน้อย', mode: 'met', kcal: 150, met: 3.5, minutes: 30, perWeek: 2 }
        ],
        entries: []
      },
      patt: {
        name: 'พัช', sex: '', age: '', height: '', goalWeight: '', deficit: 500, job: 'office',
        activities: [
          { id: uid(), name: 'เดินเร็ว', mode: 'met', kcal: 180, met: 4.3, minutes: 45, perWeek: 3 }
        ],
        entries: []
      }
    }
  };
}

// Person data lives in Firestore (people/ton, people/patt); tab & chart mode are per-device prefs.
let S = defaults();
try { Object.assign(S, JSON.parse(localStorage.getItem(PREF_KEY)) || {}); } catch {}
const configured = firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('YOUR');
const fb = configured ? initializeApp(firebaseConfig) : null;
// The PIN is never stored in this (public) code: data lives at vault/{pin}/people/{id}
// and firestore.rules only allows the real PIN, so a wrong PIN is rejected by Firebase itself.
const db = fb && getFirestore(fb);
let pin = null, loaded = new Set(), dbError = null, pinError = '', unsubs = [];
try { pin = localStorage.getItem(PIN_KEY); } catch {}
const personDoc = id => doc(db, 'vault', pin, 'people', id);
const synced = {};

function save() {
  try { localStorage.setItem(PREF_KEY, JSON.stringify({ tab: S.tab, chartMode: S.chartMode })); } catch {}
  if (!pin || loaded.size < IDS.length) return;
  for (const id of IDS) {
    const json = JSON.stringify(S.people[id]);
    if (json === synced[id]) continue;
    synced[id] = json;
    setDoc(personDoc(id), JSON.parse(json)).catch(onDbError);
  }
}

function onDbError(err) {
  console.error(err);
  if (err.code === 'permission-denied') { lock('รหัสไม่ถูกต้อง'); return; }
  dbError = `เชื่อมต่อฐานข้อมูลไม่ได้ (${err.code || err.message})`;
  render();
}

function listen() {
  unsubs.forEach(u => u()); unsubs = []; loaded = new Set(); dbError = null;
  for (const id of IDS) {
    unsubs.push(onSnapshot(personDoc(id), snap => {
      if (snap.exists()) { S.people[id] = snap.data(); synced[id] = JSON.stringify(S.people[id]); }
      else { S.people[id] = defaults().people[id]; synced[id] = ''; }
      loaded.add(id);
      if (!snap.exists() && loaded.size === IDS.length) save();
      scheduleRender();
    }, onDbError));
  }
}

function unlock(code) {
  pin = code; pinError = '';
  try { localStorage.setItem(PIN_KEY, pin); } catch {}
  listen(); render();
}

function lock(msg = '') {
  unsubs.forEach(u => u()); unsubs = []; loaded = new Set();
  pin = null; pinError = msg; dbError = null;
  try { localStorage.removeItem(PIN_KEY); } catch {}
  render();
}

// Don't wipe a half-typed input when the other person's update arrives.
let renderPending = false;
function scheduleRender() {
  const a = document.activeElement;
  if (a && a.closest('#app') && /INPUT|SELECT/.test(a.tagName)) {
    if (!renderPending) { renderPending = true; a.addEventListener('blur', () => { renderPending = false; render(); }, { once: true }); }
    return;
  }
  render();
}

// ---------- calculations ----------
const sorted = p => [...p.entries].sort((a, b) => a.date.localeCompare(b.date));
const latest = p => { const e = sorted(p); return e.length ? e[e.length - 1] : null; };
const profileReady = p => p.sex && +p.age > 0 && +p.height > 0;

function actKcal(a, w) {
  // MET mode uses net calories (MET-1) so we don't double count resting burn already in BMR
  return a.mode === 'kcal' ? +a.kcal || 0 : Math.max(0, (+a.met - 1)) * w * ((+a.minutes || 0) / 60);
}

function calc(p, weight) {
  const w = weight ?? latest(p)?.weight;
  if (!w || !profileReady(p)) return null;
  const bmr = 10 * w + 6.25 * +p.height - 5 * +p.age + (p.sex === 'm' ? 5 : -161);
  const base = bmr * JOBS[p.job].f;
  const acts = p.activities.map(a => ({ ...a, burn: actKcal(a, w), perWeek: +a.perWeek || 0 }));
  const weekly = acts.reduce((s, a) => s + a.burn * a.perWeek, 0);
  const exPct = p.exPct ?? 75;
  const exPerDay = weekly / 7 * exPct / 100;
  const tdee = base + exPerDay;
  const deficit = +p.deficit || 0;
  const target = tdee - deficit;
  const floor = p.sex === 'm' ? 1500 : 1200;
  const bmi = w / ((+p.height / 100) ** 2);
  return { w, bmr, base, weekly, exPct, exPerDay, tdee, target, floor, bmi, expectedRate: Math.max(0, tdee - Math.max(target, floor)) * 7 / KCAL_PER_KG };
}

// Protein = g/kg bodyweight; fat = % of calories (WHO/IOM AMDR 20–35%); carbs = whatever is left.
function macros(p) {
  const r = calc(p);
  if (!r) return null;
  const kcal = Math.max(r.target, r.floor);
  const perKg = +(p.proteinPerKg ?? 1), fatPct = +(p.fatPct ?? 30);
  const protG = r.w * perKg, protK = protG * 4;
  const fatK = kcal * fatPct / 100, fatG = fatK / 9;
  const carbK = Math.max(0, kcal - protK - fatK), carbG = carbK / 4;
  const pct = k => k / kcal * 100;
  return { kcal, perKg, fatPct, w: r.w,
    prot: { g: protG, k: protK, pct: pct(protK) },
    carb: { g: carbG, k: carbK, pct: pct(carbK) },
    fat: { g: fatG, k: fatK, pct: pct(fatK) } };
}

// Protein per typical serving (cooked weight), rough Thai-food reference values.
const FOODS = [
  { name: 'อกไก่ 100 ก.', p: 31, kcal: 165 },
  { name: 'ไข่ต้ม 1 ฟอง', p: 6, kcal: 75 },
  { name: 'ไข่ขาว 1 ฟอง', p: 4, kcal: 17 },
  { name: 'หมูสันใน 100 ก.', p: 26, kcal: 145 },
  { name: 'ปลานิล 100 ก.', p: 26, kcal: 130 },
  { name: 'กุ้ง 100 ก.', p: 24, kcal: 100 },
  { name: 'เต้าหู้แข็ง 100 ก.', p: 15, kcal: 145 },
  { name: 'นมจืด 200 มล.', p: 6, kcal: 125 },
  { name: 'กรีกโยเกิร์ต 150 ก.', p: 15, kcal: 90 },
  { name: 'เวย์ 1 สกู๊ป', p: 24, kcal: 120 },
  { name: 'ข้าวสวย 1 ทัพพี', p: 1.5, kcal: 80 }
];
const openProg = {};
const todayItems = p => p.today?.date === todayStr() ? p.today.items : [];



function trend(p) {
  // linear regression over the last 28 days → kg/week
  const e = sorted(p);
  if (e.length < 2) return null;
  const last = dayMs(e[e.length - 1].date);
  const pts = e.filter(x => dayMs(x.date) >= last - 28 * 864e5).map(x => [(dayMs(x.date) - last) / 864e5, +x.weight]);
  if (pts.length < 2) return null;
  const span = -pts[0][0];
  if (span < 7) return { span, perWeek: null };
  const n = pts.length, mx = pts.reduce((s, q) => s + q[0], 0) / n, my = pts.reduce((s, q) => s + q[1], 0) / n;
  const slope = pts.reduce((s, q) => s + (q[0] - mx) * (q[1] - my), 0) / pts.reduce((s, q) => s + (q[0] - mx) ** 2, 0);
  return { span, perWeek: slope * 7 };
}

// ---------- rendering ----------
const C = id => id === 'ton' ? 'var(--ton)' : 'var(--patt)';
const CS = id => id === 'ton' ? 'var(--ton-soft)' : 'var(--patt-soft)';
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let charts = [];

function gate() {
  if (!configured) return `<div class="card center"><h2>ยังไม่ได้ตั้งค่า Firebase</h2><p>ใส่ค่า config ในไฟล์ <code>firebase-config.js</code> ตามขั้นตอนใน README.md</p></div>`;
  if (!pin) return `<form class="card center" id="pinForm"><h2>🔒 ใส่รหัสเพื่อเข้าใช้งาน</h2>
    <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" maxlength="12" style="text-align:center;font-size:24px;letter-spacing:8px;margin:8px 0 12px" autofocus>
    ${pinError ? `<p class="bad" style="margin:0 0 10px">${esc(pinError)}</p>` : ''}
    <button class="btn" type="submit" style="width:100%">ปลดล็อก</button></form>`;
  if (dbError) return `<div class="card center"><h2>เข้าไม่ได้</h2><p>${esc(dbError)}</p><button class="ghost" id="lockBtn2">ลองใหม่</button></div>`;
  if (loaded.size < IDS.length) return `<div class="center"><p>กำลังโหลดข้อมูล…</p></div>`;
  return '';
}

function render() {
  const blocked = gate();
  document.getElementById('tabs').classList.toggle('hidden', !!blocked);
  document.getElementById('footer').classList.toggle('hidden', !!blocked);
  if (blocked) {
    charts.forEach(c => c.destroy()); charts = [];
    document.getElementById('app').innerHTML = blocked;
    const pf = document.getElementById('pinForm');
    if (pf) {
      document.getElementById('pinInput').focus();
      pf.onsubmit = ev => { ev.preventDefault(); const v = document.getElementById('pinInput').value.trim(); if (v) unlock(v); };
    }
    const lo = document.getElementById('lockBtn2');
    if (lo) lo.onclick = () => lock();
    return;
  }
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  charts.forEach(c => c.destroy()); charts = [];
  const app = document.getElementById('app');
  if (S.tab === 'overview') {
    app.innerHTML = `
      <div class="card">
        <div class="person-head"><h2 style="margin:0">น้ำหนัก</h2>${modeSeg()}</div>
        <div class="chart-box tall"><canvas id="chartAll"></canvas></div>
      </div>
      <div class="grid g2" style="margin-top:14px">${IDS.map(summaryCard).join('')}</div>`;
    drawChart('chartAll', IDS);
  } else {
    app.innerHTML = personPage(S.tab);
    drawChart('chartOne', [S.tab]);
  }
  bind();
}

function modeSeg() {
  return `<div class="seg">${[['kg', 'กก.'], ['pct', '% เปลี่ยนแปลง']].map(([k, l]) => `<button data-mode="${k}" class="${S.chartMode === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
}

function etaText(p) {
  const r = calc(p), t = trend(p), cur = latest(p)?.weight, goal = +p.goalWeight;
  if (!cur || !goal) return '–';
  if (cur <= goal) return '🎉 ถึงเป้า';
  const rate = t?.perWeek < 0 ? -t.perWeek : r?.expectedRate;
  if (!rate) return '–';
  const d = new Date(); d.setDate(d.getDate() + (cur - goal) / rate * 7);
  return d.toLocaleDateString('th-TH', { month: 'short', year: '2-digit' });
}

function statsBlock(id, withExtras = true) {
  const p = S.people[id], e = sorted(p), r = calc(p);
  const cur = e.length ? +e[e.length - 1].weight : null, start = e.length ? +e[0].weight : null;
  const diff = cur != null ? cur - start : null;
  return `<div class="stats">
    <div class="stat"><div class="l">น้ำหนักล่าสุด</div><div class="v">${fmt(cur, 1)} <small>กก.</small></div></div>
    <div class="stat"><div class="l">เปลี่ยนแปลงรวม</div><div class="v ${diff < 0 ? 'good' : diff > 0 ? 'bad' : ''}">${diff == null ? '–' : (diff > 0 ? '+' : '') + fmt(diff, 1)} <small>กก.</small></div></div>
    <div class="stat"><div class="l">คาดว่าถึงเป้า</div><div class="v" style="font-size:17px">${etaText(p)}</div></div>
    ${withExtras ? `<div class="stat"><div class="l">BMI</div><div class="v">${fmt(r?.bmi, 1)}</div></div>` : ''}
  </div>`;
}

// Donut of the day's calories: protein slice centred at the top, grams printed inside each slice,
// total kcal in the middle.
function donut(m) {
  const cx = 120, cy = 120, R = 86, W = 46, CIRC = 2 * Math.PI * R, GAP = 3;
  const segs = [['prot', 'โปรตีน', m.prot], ['carb', 'คาร์บ', m.carb], ['fat', 'ไขมัน', m.fat]];
  let start = -Math.PI / 2 - m.prot.pct / 100 * Math.PI, arcs = '', labels = '';
  for (const [k, name, x] of segs) {
    const frac = x.pct / 100, ang = frac * 2 * Math.PI;
    arcs += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--${k})" stroke-width="${W}"
      stroke-dasharray="${Math.max(0, frac * CIRC - GAP)} ${CIRC}" transform="rotate(${start * 180 / Math.PI} ${cx} ${cy})">
      <title>${name} ${fmt(x.g)} ก. · ${fmt(x.k)} kcal · ${fmt(x.pct)}%</title></circle>`;
    const mid = start + ang / 2, lx = (cx + R * Math.cos(mid)).toFixed(1), ly = (cy + R * Math.sin(mid)).toFixed(1);
    if (frac > 0.08) labels += `<text x="${lx}" y="${ly}" text-anchor="middle" class="dl"><tspan x="${lx}" dy="-0.55em">${name}</tspan><tspan x="${lx}" dy="1.25em" class="dg">${fmt(x.g)} ก.</tspan></text>`;
    start += ang;
  }
  return `<svg class="donut" viewBox="0 0 240 240" role="img" aria-label="ควรกิน ${fmt(m.kcal)} kcal ต่อวัน: โปรตีน ${fmt(m.prot.g)} กรัม คาร์บ ${fmt(m.carb.g)} กรัม ไขมัน ${fmt(m.fat.g)} กรัม">
    ${arcs}${labels}
    <text x="${cx}" y="${cy - 6}" text-anchor="middle" class="dc">${fmt(m.kcal)}</text>
    <text x="${cx}" y="${cy + 22}" text-anchor="middle" class="du">kcal / วัน</text></svg>`;
}

function energyBlock(id) {
  const p = S.people[id], r = calc(p), m = macros(p);
  if (!r) return `<div class="alert">${!profileReady(p) ? `กรอก <b>เพศ อายุ ส่วนสูง</b> ในแท็บ “${p.name}” ก่อน` : 'บันทึกน้ำหนักอย่างน้อย 1 ครั้ง'} เพื่อคำนวณ TDEE</div>`;
  return `${donut(m)}
    <div class="energy-sub">คาดลด ~${fmt(r.expectedRate, 2)} กก./สัปดาห์</div>
    ${r.target < r.floor ? `<div class="alert">เป้าคำนวณได้ ${fmt(r.target)} kcal ต่ำกว่าขั้นต่ำที่แนะนำ (${r.floor}) จึงแสดงเป็น ${r.floor} แทน · ลองลด “ลดวันละ” ลง</div>` : ''}`;
}

      <label>ไขมัน (% ของแคล)${chips('fatPct', [25, 30, 35], m.fatPct, '%')}</label>

function eatenBlock(id) {
  const p = S.people[id], m = macros(p);

  const meter = (label, v, max, unit, key) => {

    return `<div class="meter" style="--m:var(--${key})">

  };
  return `

function progress(id) {
  const p = S.people[id], e = sorted(p);
  if (!+p.goalWeight) return `<div class="alert">ยังไม่ได้ตั้งน้ำหนักเป้าหมาย · <a href="#" data-go="${id}" style="color:inherit">ตั้งเป้า →</a></div>`;
  if (!e.length) return '';
  const start = +e[0].weight, cur = +e[e.length - 1].weight, goal = +p.goalWeight;
  const pct = start > goal ? Math.min(100, Math.max(0, (start - cur) / (start - goal) * 100)) : 100;
  return `<details class="prog" data-prog="${id}" ${openProg[id] ? 'open' : ''}>
    <summary>
      <div class="row" style="justify-content:space-between;font-size:13px"><span>🎯 ${fmt(start, 1)} → <b>${fmt(goal, 1)}</b> กก.</span><span class="muted">${fmt(pct)}% · เหลือ ${fmt(Math.max(0, cur - goal), 1)} กก. <span class="chev">▾</span></span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </summary>
    ${statsBlock(id, false)}
  </details>`;
}

function goalCard(id) {

  }
  const chips = (field, opts, val, unit = '') => `<div class="chips">${opts.map(v => `<button data-chip="${field}" data-v="${v}" class="${+val === v ? 'on' : ''}">${v}${unit}</button>`).join('')}</div>`;

function insight(id) {
  const p = S.people[id], t = trend(p), r = calc(p);
  if (!r || !t || t.span < 14 || t.perWeek == null) return `<div class="note">💡 เมื่อมีข้อมูลครบ 2 สัปดาห์ขึ้นไป ระบบจะประเมิน “TDEE จากผลจริง” ให้ เพื่อปรับเป้าให้แม่นขึ้น</div>`;
  const realTdee = r.target + (-t.perWeek * KCAL_PER_KG / 7);
  const gap = realTdee - r.tdee;
  let msg;
  if (t.perWeek > -0.1) msg = 'น้ำหนักแทบไม่ลดใน 2–4 สัปดาห์ ลองเช็กว่ากินตามเป้าจริงไหม หรือลดเป้าลงอีก 150–200 kcal';
  else if (-t.perWeek > r.w * 0.01) msg = 'ลดเร็วเกิน ~1% ของน้ำหนัก/สัปดาห์ เสี่ยงเสียกล้ามเนื้อ ลองเพิ่มแคลอีก 150–250 kcal และกินโปรตีนให้พอ';
  else msg = 'กำลังลดในอัตราที่ดี ทำต่อไปได้เลย 👍';
  return `<div class="alert" style="border-color:${C(id)}">
    <b>TDEE จากผลจริง ≈ ${fmt(realTdee)} kcal</b> <span class="muted">(สูตรคำนวณได้ ${fmt(r.tdee)} · ต่างกัน ${gap > 0 ? '+' : ''}${fmt(gap)})</span><br>
    ${msg}<br><span class="muted">*ประเมินโดยสมมติว่ากินตามเป้า ${fmt(r.target)} kcal/วัน สม่ำเสมอ</span></div>`;
}

// Goal lines are drawn here (not as datasets) so they never catch hover/tap tooltips.
// Also draws a name pill above each person's first weigh-in.
const tagPlugin = {
  id: 'tags',
  beforeDatasetsDraw(chart, _, opts) {
    const { ctx, chartArea: a, scales: { y } } = chart;
    (opts.goals || []).forEach(g => {
      const py = y.getPixelForValue(g.y);
      if (py < a.top || py > a.bottom) return;
      ctx.save();
      ctx.strokeStyle = g.color; ctx.lineWidth = 1.2; ctx.setLineDash([6, 5]);
      ctx.beginPath(); ctx.moveTo(a.left, py); ctx.lineTo(a.right, py); ctx.stroke();
      ctx.font = '500 11px "IBM Plex Sans Thai", sans-serif';
      ctx.fillStyle = g.color; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
      ctx.fillText(g.tag, a.right - 2, py - 4);
      ctx.restore();
    });
  },
  afterDatasetsDraw(chart) {
    const { ctx, chartArea: a } = chart;
    chart.data.datasets.forEach((ds, i) => {
      const meta = chart.getDatasetMeta(i);
      if (!ds.tag || meta.hidden || !meta.data.length) return;
      ctx.save();
      {
        const pt = meta.data[0];
        ctx.font = '600 12px "IBM Plex Sans Thai", sans-serif';
        const w = ctx.measureText(ds.tag).width + 16, h = 22;
        const x = Math.max(a.left, Math.min(pt.x - w / 2, a.right - w)), y = Math.max(a.top - 26, pt.y - h - 9);
        ctx.fillStyle = ds.borderColor;
        ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, 11) : ctx.rect(x, y, w, h); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(ds.tag, x + w / 2, y + h / 2 + 1);
      }
      ctx.restore();
    });
  }
};

function drawChart(canvasId, ids) {
  const el = document.getElementById(canvasId);
  if (!el || !window.Chart) return;
  const pct = S.chartMode === 'pct';
  const text = css('--muted'), grid = css('--border'), surface = css('--surface');
  const people = ids.map(id => ({ id, p: S.people[id], e: sorted(S.people[id]) })).filter(x => x.e.length);
  if (!people.length) { el.parentElement.innerHTML = '<div class="muted" style="display:grid;place-items:center;height:100%">ยังไม่มีข้อมูลน้ำหนัก — บันทึกได้ในแท็บของแต่ละคน</div>'; return; }
  const allX = people.flatMap(x => x.e.map(v => dayMs(v.date)));
  const x0 = Math.min(...allX), x1 = Math.max(Math.max(...allX), x0 + 7 * 864e5);
  const datasets = [], goals = [];
  people.forEach(({ id, p, e }) => {
    const col = css(id === 'ton' ? '--ton' : '--patt'), base = +e[0].weight;
    const val = w => pct ? (w - base) / base * 100 : w;
    datasets.push({ label: p.name, tag: p.name, data: e.map(v => ({ x: dayMs(v.date), y: val(+v.weight) })),
      borderColor: col, backgroundColor: col, borderWidth: 2.5, tension: .3,
      pointRadius: 3.5, pointHoverRadius: 6, pointBackgroundColor: surface, pointBorderColor: col, pointBorderWidth: 2 });
    if (!pct && +p.goalWeight) goals.push({ y: +p.goalWeight, color: col, tag: `เป้า ${p.name} ${fmt(p.goalWeight, 1)}` });
  });
  charts.push(new Chart(el, {
    type: 'line', data: { datasets }, plugins: [tagPlugin],
    options: {
      responsive: true, maintainAspectRatio: false, interaction: { mode: 'nearest', intersect: false },
      layout: { padding: { top: 34, right: 8 } },
      plugins: {
        legend: { display: false },
        tags: { goals },
        tooltip: { callbacks: {
          title: it => new Date(it[0].parsed.x).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }),
          label: it => `${it.dataset.label}: ${fmt(it.parsed.y, pct ? 2 : 1)}${pct ? '%' : ' กก.'}` } }
      },
      scales: {
        x: { type: 'linear', min: x0 - 864e5 / 2, max: x1 + 864e5 / 4, grid: { display: false }, border: { color: grid },
          ticks: { color: text, maxTicksLimit: 7, callback: v => new Date(v).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', timeZone: 'UTC' }) } },
        y: { grace: '8%', suggestedMin: goals.length ? Math.min(...goals.map(g => g.y)) : undefined, suggestedMax: goals.length ? Math.max(...goals.map(g => g.y)) : undefined, grid: { color: grid }, border: { display: false }, ticks: { color: text, callback: v => pct ? v.toFixed(1) + '%' : v } }
      }
    }
  }));
}

// ---------- events ----------
function bind() {
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = ev => { ev.preventDefault(); setTab(b.dataset.go); });
  document.querySelectorAll('details[data-prog]').forEach(d => d.ontoggle = () => { openProg[d.dataset.prog] = d.open; });
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { S.chartMode = b.dataset.mode; save(); render(); });
  document.querySelectorAll('form[data-add]').forEach(f => f.onsubmit = ev => {
    ev.preventDefault();
    const p = S.people[f.dataset.add], fd = new FormData(f);
    const entry = { id: uid(), date: fd.get('date'), weight: +fd.get('weight') };
    const i = p.entries.findIndex(x => x.date === entry.date);
    if (i >= 0) p.entries[i] = { ...p.entries[i], ...entry, id: p.entries[i].id }; else p.entries.push(entry);
    save(); render();
  });
  const id = S.tab, p = S.people[id];
  if (!p) return;
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    if (!confirm('ลบรายการนี้?')) return;
    p.entries = p.entries.filter(x => x.id !== b.dataset.del); save(); render();
  });
  document.querySelectorAll('[data-f]').forEach(inp => inp.onchange = () => { p[inp.dataset.f] = inp.dataset.f === 'exPct' ? +inp.value : inp.value; save(); render(); });
  document.querySelectorAll('[data-chip]').forEach(b => b.onclick = ev => { ev.preventDefault(); p[b.dataset.chip] = +b.dataset.v; save(); render(); });
  const eat = item => {
    if (p.today?.date !== todayStr()) p.today = { date: todayStr(), items: [] };
    p.today.items.push({ id: uid(), ...item }); save(); render();
  };
  document.querySelectorAll('[data-food]').forEach(b => b.onclick = () => { const f = FOODS[b.dataset.food]; eat({ name: f.name, p: f.p, kcal: f.kcal }); });
  document.querySelectorAll('[data-uneat]').forEach(b => b.onclick = () => { p.today.items = p.today.items.filter(x => x.id !== b.dataset.uneat); save(); render(); });
  const cf = document.getElementById('customFood');
  if (cf) cf.onsubmit = ev => {
    ev.preventDefault();
    const fd = new FormData(cf);
    if (!fd.get('p') && !fd.get('kcal')) return;
    eat({ name: fd.get('name') || 'อื่น ๆ', p: +fd.get('p') || 0, kcal: +fd.get('kcal') || 0 });
  };
  document.querySelectorAll('[data-act]').forEach(row => {
    const a = p.activities.find(x => x.id === row.dataset.act);
    row.querySelectorAll('[data-a]').forEach(inp => inp.onchange = () => { a[inp.dataset.a] = inp.type === 'number' ? +inp.value : inp.value; save(); render(); });
  });
  document.querySelectorAll('[data-actdel]').forEach(b => b.onclick = () => { p.activities = p.activities.filter(x => x.id !== b.dataset.actdel); save(); render(); });
  const add = document.getElementById('addAct');
  if (add) add.onclick = () => { p.activities.push({ id: uid(), name: 'กิจกรรมใหม่', mode: 'met', kcal: 200, met: 4, minutes: 30, perWeek: 1 }); save(); render(); };
}

function setTab(t) { S.tab = t; save(); render(); window.scrollTo(0, 0); }
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));

document.getElementById('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `tdee-backup-${todayStr()}.json` });
  a.click(); URL.revokeObjectURL(a.href);
};
document.getElementById('importFile').onchange = async ev => {
  const f = ev.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data.people?.ton || !data.people?.patt) throw 0;
    if (confirm('แทนที่ข้อมูลของทั้งสองคนด้วยไฟล์นี้?')) { S.people = data.people; save(); render(); }
  } catch { alert('ไฟล์ไม่ถูกต้อง'); }
  ev.target.value = '';
};
document.getElementById('logoutBtn').onclick = () => lock();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
// Mobile Safari sometimes misses canvas resizes (rotation, pinch-zoom, back/forward cache) — force a refit.
let resizeTimer;
const refit = () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => charts.forEach(c => c.resize()), 150); };
addEventListener('resize', refit);
addEventListener('orientationchange', refit);
window.visualViewport?.addEventListener('resize', refit);
addEventListener('pageshow', e => { if (e.persisted) render(); });

if (configured && pin) listen();
render();
</script>
</body>
